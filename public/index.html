  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--texto);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand{font-family:'Fraunces',serif;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Inter',sans-serif;}
  a{color:var(--azul);}

  /* ---------- LOGIN ---------- */
  #tela-login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(242,137,43,0.16), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(19,42,82,0.18), transparent 50%),
      var(--bg);
    padding:24px;
  }
  .cartao-login{
    background:var(--bg-card);
    border-radius:var(--raio);
    box-shadow:var(--sombra);
    padding:40px 36px;
    width:100%;
    max-width:380px;
    text-align:center;
  }
  .logo-wordmark{
    font-size:2.1rem;
    font-weight:700;
    letter-spacing:0.5px;
    background:linear-gradient(120deg, var(--azul-escuro), var(--laranja));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:0 0 4px;
  }
  .subtitulo-login{
    color:var(--texto-suave);
    font-size:0.92rem;
    margin-bottom:28px;
  }
  .campo{
    text-align:left;
    margin-bottom:16px;
  }
  .campo label{
    display:block;
    font-size:0.82rem;
    font-weight:600;
    margin-bottom:6px;
    color:var(--texto-suave);
  }
  .campo input, .campo select, .campo textarea{
    width:100%;
    padding:11px 13px;
    border:1.5px solid var(--linha);
    border-radius:10px;
    font-size:0.95rem;
    background:#fff;
    color:var(--texto);
    transition:border-color .15s;
  }
  .campo input:focus, .campo select:focus, .campo textarea:focus{
    outline:none;
    border-color:var(--laranja);
  }
  .btn{
    border:none;
    border-radius:10px;
    padding:12px 20px;
    font-weight:600;
    font-size:0.94rem;
    transition:transform .12s, box-shadow .12s, opacity .12s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primario{
    background:linear-gradient(120deg, var(--azul), var(--laranja-forte));
    color:#fff;
    width:100%;
  }
  .btn-primario:hover{box-shadow:0 6px 16px rgba(224,106,22,0.35);}
  .btn-secundario{
    background:#fff;
    border:1.5px solid var(--linha);
    color:var(--texto);
  }
  .btn-secundario:hover{border-color:var(--azul);}
  .btn-perigo{
    background:#fff;
    border:1.5px solid var(--erro);
    color:var(--erro);
  }
  .btn-perigo:hover{background:var(--erro);color:#fff;}
  .btn-sm{padding:7px 12px;font-size:0.82rem;border-radius:8px;}
  .erro-msg{
    background:rgba(198,67,46,0.1);
    color:var(--erro);
    padding:10px 12px;
    border-radius:8px;
    font-size:0.85rem;
    margin-bottom:16px;
    text-align:left;
    display:none;
  }
  .dica-senha{
    font-size:0.78rem;
    color:var(--texto-suave);
    margin-top:18px;
  }

  /* ---------- APP SHELL ---------- */
  #app{display:none;min-height:100vh;flex-direction:column;}
  header.topo{
    background:var(--azul-escuro);
    color:#fff;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:64px;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 2px 12px rgba(0,0,0,0.12);
  }
  .topo-esquerda{display:flex;align-items:center;gap:14px;}
  .topo .logo-wordmark{font-size:1.35rem;-webkit-background-clip:unset;background-clip:unset;background:none;color:#fff;}
  .topo .logo-wordmark span{color:var(--laranja-claro);}
  .logo-chip{
    background:rgba(255,255,255,0.94);
    border-radius:10px;
    padding:5px 12px;
    display:flex;
    align-items:center;
    height:44px;
  }
  .logo-chip img{height:34px;width:auto;display:block;}
  nav.menu-desktop{display:flex;gap:4px;}
  nav.menu-desktop button{
    background:transparent;
    border:none;
    color:rgba(255,255,255,0.78);
    padding:10px 14px;
    border-radius:8px;
    font-size:0.88rem;
    font-weight:500;
    transition:background .15s,color .15s;
    white-space:nowrap;
  }
  nav.menu-desktop button:hover{background:rgba(255,255,255,0.08);color:#fff;}
  nav.menu-desktop button.ativo{background:var(--laranja);color:#fff;}
  .topo-direita{display:flex;align-items:center;gap:12px;}
  .usuario-chip{
    font-size:0.85rem;
    color:rgba(255,255,255,0.85);
  }
  .hamburguer{display:none;background:none;border:none;color:#fff;font-size:1.4rem;padding:6px;}
  #menu-mobile{
    display:none;
    flex-direction:column;
    background:var(--azul-escuro);
    padding:8px 12px 14px;
  }
  #menu-mobile button{
    background:none;border:none;color:rgba(255,255,255,0.85);
    text-align:left;padding:12px 10px;font-size:0.95rem;border-radius:8px;
  }
  #menu-mobile button.ativo{background:var(--laranja);color:#fff;}

  main{flex:1;padding:26px 20px 60px;max-width:1180px;margin:0 auto;width:100%;}

  .cabecalho-secao{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:22px;
  }
  .cabecalho-secao h2{margin:0 0 4px;font-size:1.5rem;color:var(--azul-escuro);}
  .cabecalho-secao p{margin:0;color:var(--texto-suave);font-size:0.9rem;}

  .marca-dagua-inicio{position:relative;}
  .marca-dagua-inicio::before{
    content:"";
    position:fixed;
    top:60px; left:0; right:0; bottom:0;
    background-image:var(--logo-mini);
    background-repeat:no-repeat;
    background-position:center 42vh;
    background-size:420px;
    opacity:0.05;
    pointer-events:none;
    z-index:0;
  }
  .marca-dagua-inicio > *{position:relative;z-index:1;}

  .grade-dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:16px;
  }
  .cartao-atalho{
    background:var(--bg-card);
    border-radius:var(--raio);
    box-shadow:var(--sombra);
    padding:22px;
    border-top:4px solid var(--laranja);
    cursor:pointer;
    transition:transform .15s;
  }
  .cartao-atalho:hover{transform:translateY(-3px);}
  .cartao-atalho.selecionado-filtro{border-top-color:var(--azul-escuro);box-shadow:0 0 0 2px var(--azul-escuro) inset;}
  .cartao-atalho .numero{font-size:2rem;font-weight:700;font-family:'Fraunces',serif;color:var(--azul-escuro);}
  .cartao-atalho .rotulo{color:var(--texto-suave);font-size:0.88rem;margin-top:4px;}

  .cartao{
    background:var(--bg-card);
    border-radius:var(--raio);
    box-shadow:var(--sombra);
    padding:24px;
    margin-bottom:20px;
  }
  .linha-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;}
  .barra-acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}

  table{width:100%;border-collapse:collapse;font-size:0.9rem;}
  thead th{
    text-align:left;
    padding:10px 12px;
    color:var(--texto-suave);
    font-weight:600;
    border-bottom:2px solid var(--linha);
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  tbody td{padding:11px 12px;border-bottom:1px solid var(--linha);vertical-align:middle;}
  tbody tr:hover{background:rgba(242,137,43,0.04);}
  .tabela-wrap{overflow-x:auto;}
  .avatar-mini{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--linha);display:inline-block;vertical-align:middle;}
  .selo{
    padding:4px 10px;border-radius:20px;font-size:0.76rem;font-weight:600;display:inline-block;
  }
  .selo-pendente{background:rgba(198,67,46,0.12);color:var(--erro);}
  .selo-confirmado{background:rgba(62,142,90,0.12);color:var(--sucesso);}
  .selo-admin{background:rgba(19,42,82,0.12);color:var(--azul-escuro);}
  .selo-usuario{background:rgba(62,107,176,0.12);color:var(--azul);}
  .selo-tecnica{background:rgba(242,137,43,0.14);color:var(--laranja-forte);}
  .selo-diretoria{background:rgba(122,63,163,0.14);color:#7a3fa3;}
  .selo-financeiro{background:rgba(23,138,101,0.14);color:#178a65;}

  .vazio{
    text-align:center;
    padding:36px 20px;
    color:var(--texto-suave);
  }

  /* calendar */
  .cal-cabecalho{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .cal-cabecalho h3{margin:0;color:var(--azul-escuro);}
  .grade-cal-wrap{overflow-x:auto;} /* rede de segurança em telas extremamente estreitas */
  .grade-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;min-width:280px;}
  .cal-dow{text-align:center;font-size:0.72rem;color:var(--texto-suave);font-weight:600;padding-bottom:4px;}
  .cal-dia{
    min-width:0;min-height:64px;border-radius:8px;border:1px solid var(--linha);
    padding:6px;font-size:0.8rem;position:relative;background:#fff;
    overflow:hidden;box-sizing:border-box;
  }
  .cal-dia.fora{opacity:0.35;}
  .cal-dia.hoje{border-color:var(--laranja);border-width:2px;}
  .ponto-evento{width:6px;height:6px;border-radius:50%;background:var(--laranja);display:inline-block;margin-right:3px;flex-shrink:0;}
  .lista-eventos-dia{list-style:none;margin:4px 0 0;padding:0;font-size:0.68rem;display:flex;flex-direction:column;gap:2px;min-width:0;}
  .lista-eventos-dia li{
    background:rgba(242,137,43,0.14);color:var(--laranja-forte);border-radius:4px;
    padding:1px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
  }

  /* Em telas estreitas (celular), o nome do evento não cabe legível em 7 colunas.
     Trocamos a "pilulazinha com texto" por um marcador com a logo do AGITA —
     a lista "Próximos eventos" logo abaixo já mostra o texto completo de cada evento. */
  @media (max-width:680px){
    .cal-dia{min-height:46px;padding:3px;font-size:0.7rem;}
    .cal-dow{font-size:0.62rem;}
    .lista-eventos-dia{flex-direction:row;flex-wrap:wrap;gap:3px;margin-top:3px;}
    .lista-eventos-dia li{
      width:14px;height:14px;padding:0;border-radius:50%;
      background-image:var(--logo-mini);background-size:cover;background-position:center;
      background-color:var(--laranja-claro);
      text-indent:-9999px;overflow:hidden;
    }
  }

  /* aviso generator */
  .grade-aviso{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:24px;}
  @media (max-width:760px){.grade-aviso{grid-template-columns:1fr;}}
  #canvas-aviso{width:100%;height:auto;border-radius:10px;box-shadow:var(--sombra);background:#fff;}
  .tipos-aviso{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .tipo-opcao{
    display:flex;align-items:center;gap:8px;padding:10px 12px;border:1.5px solid var(--linha);
    border-radius:10px;cursor:pointer;font-size:0.88rem;font-weight:500;
  }
  .tipo-opcao.selecionado{border-color:var(--laranja);background:rgba(242,137,43,0.06);}

  .modal-fundo{
    display:none;position:fixed;inset:0;background:rgba(19,42,82,0.45);
    align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal-caixa{
    background:#fff;border-radius:var(--raio);padding:26px;max-width:460px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  .modal-caixa h3{margin-top:0;color:var(--azul-escuro);}

  .toast{
    position:fixed;bottom:24px;right:24px;background:var(--azul-escuro);color:#fff;
    padding:13px 18px;border-radius:10px;font-size:0.88rem;box-shadow:var(--sombra);
    z-index:200;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;
  }
  .toast.mostrar{opacity:1;transform:translateY(0);}

  @media (max-width:880px){
    nav.menu-desktop{display:none;}
    .hamburguer{display:block;}
    .usuario-chip{display:none;}
  }
</style>
</head>

function saudacaoPorHorario(){
  const hora = new Date().getHours();
  if(hora >= 5 && hora < 12) return 'Bom dia';
  if(hora >= 12 && hora < 18) return 'Boa tarde';
  if(hora >= 18 && hora < 24) return 'Boa noite';
  return 'Boa madrugada';
}

function rotuloPapel(papel){
  if(papel==='admin') return 'Administrador';
  if(papel==='tecnica') return 'Técnica';
  if(papel==='diretoria') return 'Diretoria';
  if(papel==='financeiro') return 'Financeiro';
  return 'Usuário';
}
// admin, técnica, diretoria e financeiro operam/visualizam o clube (atletas, documentos, pagamentos);
// financeiro tem as mesmas funções do admin (inclusive gestão de Usuários — ver ehAdminEquivalente);
// "usuario" (responsável/família) só acompanha calendário e avisos já publicados.
function ehEquipe(){
  return usuarioLogado.papel !== 'usuario';
}
// controla quem pode criar, editar ou excluir dados (diretoria não entra aqui)

  return usuarioLogado.papel === 'admin' || usuarioLogado.papel === 'tecnica' || usuarioLogado.papel === 'financeiro';
}

/* ---------------------------- CHAMADAS À API ---------------------------- */
async function api(caminho, opcoes = {}){
  let resp;
  try{
    resp = await fetch('/api/' + caminho, {
      method: opcoes.method || 'GET',
      credentials: 'include',
      headers: {'Content-Type':'application/json'},
      body: opcoes.corpo ? JSON.stringify(opcoes.corpo) : undefined
    });
  }catch(e){
    mostrarToast('Não foi possível conectar ao servidor.');
    throw e;
  }
  let dados = null;
  try{ dados = await resp.json(); }catch(e){ dados = null; }

  if(resp.status === 401){
    // sessão expirou ou não existe — volta pra tela de login
    usuarioLogado = null;
    document.getElementById('app').style.display = 'none';
    document.getElementById('tela-login').style.display = 'flex';
    throw new Error('Não autenticado');
  }
  if(!resp.ok){
    mostrarToast((dados && dados.erro) || 'Ocorreu um erro.');
    throw new Error((dados && dados.erro) || 'Erro na API');
  }
  return dados;
}

function mostrarToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('mostrar');
  setTimeout(()=>t.classList.remove('mostrar'), 2600);
}
function formatarData(iso){
  if(!iso) return '—';
  // datas guardadas como "AAAA-MM-DD" (sem hora) não podem passar por new Date(iso) direto:
  // o JS interpreta como UTC e, no fuso de Recife (UTC-3), o dia "volta" um dia na exibição.
  const [ano, mes, dia] = iso.split('-').map(Number);
  const d = new Date(ano, mes-1, dia);
  return d.toLocaleDateString('pt-BR');
}
function formatarSetor(setor){
  const rotulos = { 'ESCOLINHA':'Escolinha', 'PRE-EQUIPE':'Pré-equipe', 'ALTO RENDIMENTO':'Alto rendimento' };
  return rotulos[setor] || '—';
}
function formatarDataHora(iso){
  if(!iso) return 'nunca';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function dataParaISOLocal(dataObj){
  // formata um objeto Date como "AAAA-MM-DD" usando o horário LOCAL (não UTC)
  const ano = dataObj.getFullYear();
  const mes = String(dataObj.getMonth()+1).padStart(2,'0');
  const dia = String(dataObj.getDate()).padStart(2,'0');
  return `${ano}-${mes}-${dia}`;
}

/* ---------------------------- LOGIN ---------------------------- */
async function tentarLogin(){
  const usuario = document.getElementById('login-usuario').value.trim();
  const senha = document.getElementById('login-senha').value;
  const erroEl = document.getElementById('login-erro');
  erroEl.style.display = 'none';

  let resp, dados;
  try{
    resp = await fetch('/api/login', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({usuario, senha})
    });
    dados = await resp.json().catch(()=>({}));
  }catch(e){
    erroEl.textContent = 'Não foi possível conectar ao servidor.';
    erroEl.style.display = 'block';
    return;
  }
  if(!resp.ok){
    erroEl.textContent = dados.erro || 'Usuário ou senha incorretos.';
    erroEl.style.display = 'block';
    return;
  }
  usuarioLogado = dados.usuario;
  if(usuarioLogado.precisaTrocarSenha){
    document.getElementById('form-login').style.display = 'none';
    document.getElementById('form-troca-senha').style.display = 'block';
    return;
  }
  finalizarLogin(true);
}
async function confirmarTrocaSenha(){
  const s1 = document.getElementById('nova-senha-1').value;
  const s2 = document.getElementById('nova-senha-2').value;
  const erroEl = document.getElementById('login-erro');
  erroEl.style.display = 'none';
  if(s1.length < 6){
    erroEl.textContent = 'A nova senha precisa ter pelo menos 6 caracteres.';
    erroEl.style.display = 'block';
    return;
  }
  if(s1 !== s2){
    erroEl.textContent = 'As senhas não coincidem.';
    erroEl.style.display = 'block';
    return;
  }
  try{
    await api('trocar-senha', {method:'POST', corpo:{novaSenha:s1}});
  }catch(e){ return; }
  usuarioLogado.precisaTrocarSenha = false;
  finalizarLogin(true);
}
function finalizarLogin(mostrarSaudacao){
  document.getElementById('tela-login').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('login-usuario').value='';
  document.getElementById('login-senha').value='';
  document.getElementById('form-login').style.display='block';
  document.getElementById('form-troca-senha').style.display='none';
  document.getElementById('chip-usuario').textContent = usuarioLogado.nome + ' · ' + rotuloPapel(usuarioLogado.papel);
  montarMenu();
  irPara('inicio');
  if(mostrarSaudacao) mostrarSaudacaoLogin();
}
async function sair(){
  try{ await api('logout', {method:'POST'}); }catch(e){}
  usuarioLogado = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('tela-login').style.display = 'flex';
}
// se já existir uma sessão válida (cookie), entra direto sem pedir login de novo
window.addEventListener('DOMContentLoaded', async ()=>{
  try{
    const dados = await api('sessao');
    usuarioLogado = dados.usuario;
    finalizarLogin();
  }catch(e){ /* sem sessão — mantém a tela de login */ }
});

const ITENS_MENU = [
  {id:'inicio', rotulo:'Início'},
  {id:'atletas', rotulo:'Atletas', somenteEquipe:true},
  {id:'documentos', rotulo:'Documentos', somenteEquipe:true},
  {id:'pagamentos', rotulo:'Pagamentos', somenteEquipe:true},
  {id:'calendario', rotulo:'Calendário'},
  {id:'avisos', rotulo:'Avisos'},
  {id:'financeiro', rotulo:'Financeiro', somenteFinanceiro:true},
  {id:'usuarios', rotulo:'Usuários', somenteAdmin:true},
];
function montarMenu(){
  const desktop = document.getElementById('menu-desktop');
  const mobile = document.getElementById('menu-mobile');
  desktop.innerHTML=''; mobile.innerHTML='';
  ITENS_MENU.forEach(item=>{
    if(item.somenteAdmin && !ehAdminEquivalente()) return;
    if(item.somenteEquipe && !ehEquipe()) return;
    if(item.somenteFinanceiro && !podeVerFinanceiro()) return;
    const b1 = document.createElement('button');
    b1.textContent = item.rotulo; b1.dataset.secao = item.id;
    b1.onclick = ()=>irPara(item.id);
    desktop.appendChild(b1);
    const b2 = b1.cloneNode(true);
    b2.onclick = ()=>{irPara(item.id); alternarMenuMobile(true);};
    mobile.appendChild(b2);
  });
}
function alternarMenuMobile(forcarFechar){
  const m = document.getElementById('menu-mobile');
  if(forcarFechar){ m.style.display='none'; return; }
  m.style.display = (m.style.display==='flex') ? 'none' : 'flex';
}
function irPara(secao){
  secaoAtual = secao;
  document.querySelectorAll('#menu-desktop button, #menu-mobile button').forEach(b=>{
    b.classList.toggle('ativo', b.dataset.secao===secao);
  });
  const renderizadores = {
    inicio: renderInicio,
    atletas: renderAtletas,
    documentos: renderDocumentos,
    pagamentos: renderPagamentos,
    calendario: renderCalendario,
    avisos: renderAvisos,
    financeiro: renderFinanceiro,
    usuarios: renderUsuarios,
  };
  (renderizadores[secao] || renderInicio)();
  window.scrollTo({top:0, behavior:'smooth'});
}

function filtrarPorSetor(chave){
  filtroSetorAtletas = chave;
  renderResumoSetoresAtletas();
  renderTabelaAtletas();
}
function renderResumoSetoresAtletas(){
  const setores = [
    { chave:'ESCOLINHA', rotulo:'Escolinha' },
    { chave:'PRE-EQUIPE', rotulo:'Pré-equipe' },
    { chave:'ALTO RENDIMENTO', rotulo:'Alto rendimento' }
  ];
  const alvo = document.getElementById('resumo-setores');
  if(!alvo) return;
  const semSetorQtd = atletasCache.filter(a=>!setores.some(s=>s.chave===a.setor)).length;
  const cartao = (chave, numero, rotulo) => `
    <div class="cartao-atalho ${filtroSetorAtletas===chave?'selecionado-filtro':''}" onclick="filtrarPorSetor('${chave}')">
      <div class="numero">${numero}</div>
      <div class="rotulo">${rotulo}</div>
    </div>`;
  alvo.innerHTML = `
    ${cartao('todos', atletasCache.length, 'Total de atletas')}
    ${setores.map(s=>cartao(s.chave, atletasCache.filter(a=>a.setor===s.chave).length, s.rotulo)).join('')}
    ${semSetorQtd>0 ? cartao('sem-setor', semSetorQtd, 'Sem setor definido') : ''}
  `;
}
function renderTabelaAtletas(){
  const busca = (document.getElementById('busca-atleta')?.value || '').toLowerCase();
  let lista = atletasCache.filter(a=>a.nome.toLowerCase().includes(busca));

  const leitor = new FileReader();
  leitor.onload = e => fotoAtletaTemp = e.target.result;
  leitor.readAsDataURL(arq);
}

    responsavel: document.getElementById('af-responsavel').value.trim(),
    telefone: document.getElementById('af-telefone').value.trim(),
    foto: fotoAtletaTemp

  fecharModal();

  await renderAtletas();
}

function lerArquivoDoc(ev){
  const arq = ev.target.files[0];
  if(!arq) return;
  if(arq.size > 4*1024*1024){ mostrarToast('Arquivo muito grande para este protótipo (máx. ~4MB).'); ev.target.value=''; return; }
  const leitor = new FileReader();
  leitor.onload = e => arquivoDocTemp = {nomeArquivo: arq.name, conteudo: e.target.result};

}
async function salvarDocumento(){
  const atletaId = document.getElementById('doc-atleta').value;
  const tipo = document.getElementById('doc-tipo').value.trim();
  if(!atletaId){ mostrarToast('Selecione a atleta.'); return; }

  try{
    await api('documentos', {method:'POST', corpo:{atletaId, tipo: tipo||'Documento', nomeArquivo: arquivoDocTemp.nomeArquivo, conteudo: arquivoDocTemp.conteudo}});

  document.getElementById('doc-tipo').value='';

  mostrarToast('Documento adicionado.');

  if(docs.length===0){ alvo.innerHTML = `<div class="vazio">Nenhum documento para esta atleta ainda.</div>`; return; }

async function excluirDocumento(id){

   CALENDÁRIO
   ================================================================ */
let calMesAtual = new Date().getMonth();
let calAnoAtual = new Date().getFullYear();
const NOMES_MES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
async function renderCalendario(){
  const ehAdmin = podeGerenciar();
  const c = document.getElementById('conteudo');
  c.innerHTML = `
    <div class="cabecalho-secao">
      <div><h2>Calendário de eventos</h2><p>Treinos especiais, competições, reuniões e feriados do clube.</p></div>
      ${ehAdmin ? `<button class="btn btn-primario" onclick="abrirFormEvento()">+ Novo evento</button>` : ''}
    </div>
    <div class="cartao">
      <div class="cal-cabecalho">
        <button class="btn btn-sm btn-secundario" onclick="mudarMesCal(-1)">‹ Anterior</button>
        <h3 id="cal-titulo"></h3>
        <button class="btn btn-sm btn-secundario" onclick="mudarMesCal(1)">Próximo ›</button>
      </div>
      <div class="grade-cal-wrap"><div class="grade-cal" id="grade-calendario"></div></div>
    </div>
    <div class="cartao">
      <h3 style="margin-top:0;color:var(--azul-escuro);">Próximos eventos</h3>
      <div id="lista-proximos-eventos"></div>
    </div>
  `;
  await carregarEventos();
}
async function carregarEventos(){
  try{
    const dados = await api('eventos');
    eventosCache = dados.eventos;
  }catch(e){ eventosCache = []; }
  desenharCalendario();
}
function mudarMesCal(delta){
  calMesAtual += delta;
  if(calMesAtual<0){calMesAtual=11;calAnoAtual--;}
  if(calMesAtual>11){calMesAtual=0;calAnoAtual++;}
  desenharCalendario();
}
function desenharCalendario(){
  const ehAdmin = podeGerenciar();
  document.getElementById('cal-titulo').textContent = NOMES_MES[calMesAtual] + ' ' + calAnoAtual;
  const grade = document.getElementById('grade-calendario');
  const primeiroDia = new Date(calAnoAtual, calMesAtual, 1);
  const diasNoMes = new Date(calAnoAtual, calMesAtual+1, 0).getDate();
  const offset = primeiroDia.getDay();
  const hojeStr = new Date().toDateString();

  let html = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<offset;i++) html += `<div class="cal-dia fora"></div>`;
  for(let dia=1; dia<=diasNoMes; dia++){
    const dataObj = new Date(calAnoAtual, calMesAtual, dia);
    const dataISO = dataParaISOLocal(dataObj);
    const eventosDia = eventosCache.filter(e=> dataISO >= e.inicio && dataISO <= e.fim);
    const ehHoje = dataObj.toDateString()===hojeStr;
    html += `<div class="cal-dia ${ehHoje?'hoje':''}">
      <strong>${dia}</strong>
      <ul class="lista-eventos-dia">${eventosDia.map(e=>`<li title="${e.titulo}">${e.titulo}</li>`).join('')}</ul>
    </div>`;
  }
  grade.innerHTML = html;

  const hojeISO = dataParaISOLocal(new Date());
  const proximos = eventosCache
    .filter(e=> e.fim >= hojeISO)
    .sort((a,b)=> a.inicio.localeCompare(b.inicio))
    .slice(0,8);
  const alvo = document.getElementById('lista-proximos-eventos');
  if(proximos.length===0){ alvo.innerHTML = `<div class="vazio">Nenhum evento futuro cadastrado.</div>`; return; }
  alvo.innerHTML = `<table><thead><tr><th>Período</th><th>Evento</th><th>Tipo</th>${ehAdmin?'<th></th>':''}</tr></thead><tbody>
    ${proximos.map(e=>`
      <tr>
        <td>${e.inicio===e.fim ? formatarData(e.inicio) : formatarData(e.inicio)+' a '+formatarData(e.fim)}</td>
        <td>${e.titulo}</td>
        <td>${e.tipo}</td>
        ${ehAdmin ? `<td><button class="btn btn-sm btn-perigo" onclick="excluirEvento('${e.id}')">Excluir</button></td>` : ''}
      </tr>`).join('')}
  </tbody></table>`;
}
function abrirFormEvento(){
  if(!podeGerenciar()) return;
  abrirModal(`
    <h3>Novo evento</h3>
    <div class="campo"><label>Título</label><input type="text" id="ef-titulo"></div>
    <div class="linha-form">
      <div class="campo"><label>Início</label><input type="date" id="ef-inicio" onchange="sincronizarFimEvento()"></div>
      <div class="campo"><label>Término</label><input type="date" id="ef-fim"></div>
    </div>
    <div class="campo"><label>Tipo</label>
      <select id="ef-tipo">

        <option>Feriado</option><option>Outro</option>

    </div>

function sincronizarFimEvento(){

async function salvarEvento(){
  const titulo = document.getElementById('ef-titulo').value.trim();
  const inicio = document.getElementById('ef-inicio').value;

function preencherNomeAviso(){
  const id = document.getElementById('av-nome-select').value;
  const a = atletasCache.find(x=>x.id===id);
  if(a){
    document.getElementById('av-nome').value = a.nome;
    if(a.foto) avisoFotoTemp = a.foto;
  }
  desenharAviso();
}
function lerFotoAviso(ev){
  const arq = ev.target.files[0];
  if(!arq) return;
  const leitor = new FileReader();
  leitor.onload = e => { avisoFotoTemp = e.target.result; desenharAviso(); };
  leitor.readAsDataURL(arq);
}
function desenharAviso(){
  const canvas = document.getElementById('canvas-aviso');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0, '#132A52');
  grad.addColorStop(1, '#F2892B');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.globalAlpha = 0.10;
  ctx.beginPath();
  ctx.arc(W*0.86, H*0.18, 220, 0, Math.PI*2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.restore();

  ctx.font = "600 30px 'Fraunces', serif";
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.textAlign = 'left';
  ctx.fillText('AGITA', 46, 60);

  const titulo = (document.getElementById('av-titulo')?.value || '').toUpperCase();
  const sub = document.getElementById('av-sub')?.value || '';

  if(avisoTipoAtual === 'aniversario'){
    const nome = document.getElementById('av-nome')?.value || '';
    const desenharResto = () => {
      ctx.textAlign = 'left';
      ctx.font = "700 64px 'Fraunces', serif";
      ctx.fillStyle = '#ffffff';
      ctx.fillText(titulo, 380, 300);
      ctx.font = "600 40px 'Inter', sans-serif";
      ctx.fillText(nome, 380, 365);
      if(sub){
        ctx.font = "400 22px 'Inter', sans-serif";
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fillText(sub, 380, 405);
      }
    };
    if(avisoFotoTemp){
      const img = new Image();
      img.onload = ()=>{
        ctx.save();
        ctx.beginPath();
        ctx.arc(220, 337, 150, 0, Math.PI*2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(img, 70, 187, 300, 300);
        ctx.restore();
        ctx.beginPath();
        ctx.arc(220, 337, 150, 0, Math.PI*2);
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
        desenharResto();
      };
      img.src = avisoFotoTemp;
    } else {
      ctx.beginPath();
      ctx.arc(220, 337, 150, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth=8; ctx.stroke();
      desenharResto();
    }
  } else {
    ctx.textAlign = 'center';
    ctx.font = "700 76px 'Fraunces', serif";
    ctx.fillStyle = '#ffffff';
    ctx.fillText(titulo, W/2, H/2 - 10);
    if(sub){
      ctx.font = "400 26px 'Inter', sans-serif";
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.fillText(sub, W/2, H/2 + 42);
    }
  }
}
function baixarAviso(){
  const canvas = document.getElementById('canvas-aviso');
  const link = document.createElement('a');
  link.download = 'agita-aviso.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
async function publicarAviso(){
  const canvas = document.getElementById('canvas-aviso');
  const titulo = document.getElementById('av-titulo').value.trim() || 'Aviso';
  try{
    await api('avisos', {method:'POST', corpo:{

function formatarMesReferencia(mesRef){

  const [ano, mes] = mesRef.split('-');

  return nomes[Number(mes)-1] + '/' + ano;

  renderTabelaTaxas();

  taxasCache = (await api('taxas')).taxas;

async function excluirTaxa(id){
  try{ await api('taxas/'+id, {method:'DELETE'}); }catch(e){ return; }

/* ---------- RATEIO (calculadora — não grava nada no servidor) ---------- */
function renderFinanceiroRateio(){
  const alvo = document.getElementById('financeiro-conteudo');
  alvo.innerHTML = `
    <div class="cartao">
      <p style="color:var(--texto-suave);margin-top:0;">Simule o valor por atleta dividindo os custos de um evento (campeonato, viagem etc.) pelo número de atletas participantes.</p>
      <div class="linha-form">
        <div class="campo"><label>Nº de atletas</label><input type="number" id="rt-qtd" value="6" min="1" oninput="calcularRateio()"></div>
        <div class="campo"><label>Custo total (R$)</label><input type="number" step="0.01" id="rt-total" value="0" oninput="calcularRateio()"></div>
        <div class="campo"><label>Margem de imprevistos (%)</label><input type="number" id="rt-margem" value="10" oninput="calcularRateio()"></div>
        <div class="campo"><label>Subsídio do clube (R$)</label><input type="number" step="0.01" id="rt-subsidio" value="0" oninput="calcularRateio()"></div>
      </div>
      <div id="rt-resultado" class="cartao" style="background:var(--bg-suave, #f6f3ee);margin-top:6px;"></div>
    </div>
  `;
  calcularRateio();
}
function calcularRateio(){
  const qtd = Math.max(1, parseInt(document.getElementById('rt-qtd').value)||1);
  const total = parseFloat(document.getElementById('rt-total').value)||0;
  const margem = parseFloat(document.getElementById('rt-margem').value)||0;
  const subsidio = parseFloat(document.getElementById('rt-subsidio').value)||0;
  const totalComMargem = total * (1 + margem/100);
  const totalLiquido = Math.max(0, totalComMargem - subsidio);
  const porAtleta = totalLiquido / qtd;
  const linhasSimulacao = [];
  for(let n=Math.max(1,qtd-3); n<=qtd+4; n++){
    linhasSimulacao.push({n, valor: totalLiquido / n, atual: n===qtd});
  }
  document.getElementById('rt-resultado').innerHTML = `
    <p style="margin:0 0 8px;"><strong>Custo total com margem:</strong> ${formatarMoeda(totalComMargem)}</p>
    <p style="margin:0 0 8px;"><strong>Custo líquido (após subsídio):</strong> ${formatarMoeda(totalLiquido)}</p>
    <p style="margin:0 0 14px;font-size:1.3rem;"><strong>Valor por atleta (${qtd}):</strong> <span style="color:var(--laranja-forte);">${formatarMoeda(porAtleta)}</span></p>
    <p style="margin:0 0 6px;color:var(--texto-suave);">Parcelado: 2x de ${formatarMoeda(porAtleta/2)} · 3x de ${formatarMoeda(porAtleta/3)} · 4x de ${formatarMoeda(porAtleta/4)}</p>
    <table style="margin-top:10px;">
      <thead><tr><th>Nº de atletas</th><th>Valor por atleta</th></tr></thead>
      <tbody>
        ${linhasSimulacao.map(l=>`<tr style="${l.atual?'font-weight:700;background:rgba(242,137,43,0.12);':''}"><td>${l.n}</td><td>${formatarMoeda(l.valor)}</td></tr>`).join('')}
      </tbody>
    </table>
  `;
}

async function salvarUsuario(){
  const nome = document.getElementById('uf-nome').value.trim();
  const usuario = document.getElementById('uf-usuario').value.trim();
  const papel = document.getElementById('uf-papel').value;
  if(!nome || !usuario){ mostrarToast('Preencha todos os campos.'); return; }
  try{
    await api('usuarios', {method:'POST', corpo:{nome, usuario, papel}});
  }catch(e){ return; }
  fecharModal();
  await carregarUsuarios();
  mostrarToast('Usuário criado.');
}
async function resetarSenha(id){
  const u = usuariosCache.find(x=>x.id===id);
  if(!confirm(`Resetar a senha de ${u.nome} para o padrão (Agita@123)?`)) return;
  try{
    await api('usuarios/'+id+'/resetar-senha', {method:'POST'});
  }catch(e){ return; }
  await carregarUsuarios();
  mostrarToast('Senha redefinida.');
}
async function excluirUsuario(id){
  if(id===usuarioLogado.id){ mostrarToast('Você não pode excluir o usuário com o qual está logado.'); return; }
  if(!confirm('Excluir este usuário?')) return;
  try{ await api('usuarios/'+id, {method:'DELETE'}); }catch(e){ return; }
  await carregarUsuarios();
}
