let desenhoToken = 0;
const TEMAS_AVISO = {
  cancelada:   { pill:'AVISO IMPORTANTE', icone:'⚠️' },
  feriado:     { pill:'SEM AULA',         icone:'🎉' },
  aniversario: { pill:'PARABÉNS!',        icone:'🎂' },
  geral:       { pill:'COMUNICADO',       icone:'📢' }
};
function retanguloArredondado(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function ajustarTextoAviso(ctx, txt, peso, familia, tamMax, tamMin, larguraMax, linhasMax){
  let tam = tamMax, linhas = [];
  for(;;){
    ctx.font = peso + ' ' + tam + 'px ' + familia;
    linhas = quebrarTexto(ctx, txt, larguraMax);
    const larg = Math.max.apply(null, linhas.map(function(l){ return ctx.measureText(l).width; }).concat([0]));
    if((linhas.length <= linhasMax && larg <= larguraMax) || tam <= tamMin) break;
    tam -= 2;
  }
  return { tam: tam, linhas: linhas.slice(0, linhasMax) };
}
function decoracaoGinasticaAviso(ctx, W, H, tipo){
  let seed = 7; for(let i=0;i<tipo.length;i++) seed = (seed*31 + tipo.charCodeAt(i)) >>> 0;
  const rnd = function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; };
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#132A52'); g.addColorStop(0.5,'#1E4C8C'); g.addColorStop(1,'#F2892B');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalAlpha = 0.10; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(W*0.86, H*0.14, 230, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(W*0.1, H*0.92, 170, 0, Math.PI*2); ctx.fill(); ctx.restore();
  function fita(p, cor, larg){
    ctx.save(); ctx.strokeStyle = cor; ctx.lineWidth = larg; ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
    ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    ctx.bezierCurveTo(p[2],p[3],p[4],p[5],p[6],p[7]);
    ctx.bezierCurveTo(p[8],p[9],p[10],p[11],p[12],p[13]);
    ctx.stroke(); ctx.restore();
  }
  fita([-20,560, 120,420, 260,700, 380,520, 520,360, 640,640], '#FFC27A', 16);
  fita([-20,590, 130,460, 260,730, 390,560, 520,410, 650,680], '#F2892B', 7);
  fita([560,40, 700,150, 800,-30, 930,90, 1040,200, 1220,30], '#FF7BAC', 14);
  fita([560,62, 700,170, 800,-8, 930,112, 1040,222, 1220,52], '#FFD166', 6);
  function arco(x, y, r, c1, c2){
    const gg = ctx.createLinearGradient(x-r,y-r,x+r,y+r);
    gg.addColorStop(0,c1); gg.addColorStop(1,c2);
    ctx.save(); ctx.strokeStyle = gg; ctx.lineWidth = 16;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3; ctx.setLineDash([8,16]);
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke(); ctx.restore();
  }
  arco(1110, 585, 80, '#F2892B', '#FFC27A');
  arco(70, 70, 52, '#4CC9B0', '#FFD166');
  const bx = 90, by = 520, br = 36;
  const bg = ctx.createRadialGradient(bx-12, by-14, 4, bx, by, br);
  bg.addColorStop(0,'#FFD9A8'); bg.addColorStop(1,'#E06A16');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fill();
  const cores = ['#F2892B','#FFC27A','#FF7BAC','#FFD166','#4CC9B0','#ffffff','#3E6BB0'];
  for(let i=0;i<80;i++){
    const x = rnd()*W, y = rnd()*H, w = 8+rnd()*12, h = (rnd()<.5) ? w : w*2.2;
    ctx.save(); ctx.translate(x,y); ctx.rotate(rnd()*Math.PI);
    ctx.globalAlpha = 0.85; ctx.fillStyle = cores[i%cores.length];
    ctx.fillRect(-w/2,-h/2,w,h); ctx.restore();
  }
  for(let i=0;i<14;i++) estrela(ctx, rnd()*W, rnd()*H, 8+rnd()*12, 'rgba(255,255,255,.85)');
}
async function desenharAviso(){
  const canvas = document.getElementById('canvas-aviso');
  if(!canvas) return;
  const token = ++desenhoToken;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  try{ await document.fonts.load("800 80px 'Baloo 2'"); await document.fonts.load("700 30px 'Nunito'"); }catch(e){}
  const ginger = await carregarGingerImg();
  const ehAniv = avisoTipoAtual === 'aniversario';
  const foto = ehAniv ? await carregarImagem(avisoFotoTemp) : null;
  if(token !== desenhoToken) return;

  const tema = TEMAS_AVISO[avisoTipoAtual] || TEMAS_AVISO.geral;
  const titulo = (document.getElementById('av-titulo')?.value || '').toUpperCase().trim();
  let sub = (document.getElementById('av-sub')?.value || '').trim();
  const nome = (document.getElementById('av-nome')?.value || '').trim();
  if(ehAniv && !sub) sub = 'Toda a família AGITA deseja muita alegria! 🎉';

  decoracaoGinasticaAviso(ctx, W, H, avisoTipoAtual);

  const FAM_T = "'Baloo 2', sans-serif", FAM_S = "'Nunito', sans-serif";
  const LARG = 800;
  const t = ajustarTextoAviso(ctx, titulo || ' ', '800', FAM_T, ehAniv ? 80 : 96, 44, LARG, 2);
  const n = ehAniv ? ajustarTextoAviso(ctx, nome, '700', FAM_T, 50, 30, LARG, 2) : { tam:0, linhas:[] };
  const s = sub ? ajustarTextoAviso(ctx, sub, '600', FAM_S, 32, 22, LARG - 20, 3) : { tam:0, linhas:[] };

  const hT = t.linhas.length * t.tam * 1.05;
  const hN = n.linhas.length ? n.linhas.length * n.tam * 1.08 + 10 : 0;
  const hS = s.linhas.length ? s.linhas.length * s.tam * 1.3 + 16 : 0;
  const hPill = ehAniv ? 0 : 66;
  const conteudo = hPill + hT + hN + hS;
  const PAD = 38;
  const painelH = conteudo + PAD*2;
  let painelY;
  if(ehAniv){ painelY = 250; } else { painelY = Math.max(95, (H - painelH)/2 - 6); }
  const painelX = (W - 900)/2;

  // painel translúcido central
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  retanguloArredondado(ctx, painelX, painelY, 900, painelH, 34);
  ctx.fillStyle = 'rgba(19,42,82,.42)'; ctx.fill(); ctx.restore();
  ctx.save(); retanguloArredondado(ctx, painelX, painelY, 900, painelH, 34);
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.stroke(); ctx.restore();

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  let y = painelY + PAD;

  if(ehAniv){
    // foto redonda centralizada sobre o painel
    const cx = W/2, cy = 150, r = 100;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 8;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx,cy,r+12,0,Math.PI*2); ctx.fill(); ctx.restore();
    ctx.save(); ctx.strokeStyle = '#F2892B'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(cx,cy,r+19,0,Math.PI*2); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
    if(foto){
      const sc = Math.max(2*r/foto.width, 2*r/foto.height);
      ctx.drawImage(foto, cx - foto.width*sc/2, cy - foto.height*sc/2, foto.width*sc, foto.height*sc);
    } else {
      const fg = ctx.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
      fg.addColorStop(0,'#FFC27A'); fg.addColorStop(1,'#F2892B');
      ctx.fillStyle = fg; ctx.fillRect(cx-r,cy-r,2*r,2*r);
      ctx.fillStyle = '#fff'; ctx.font = "800 120px 'Baloo 2', sans-serif"; ctx.textBaseline = 'middle';
      ctx.fillText(nome ? nome.charAt(0).toUpperCase() : '🎂', cx, cy+6);
      ctx.textBaseline = 'alphabetic';
    }
    ctx.restore();
  } else {
    // etiqueta (pill) centralizada
    const dataAv = document.getElementById('av-data')?.value || '';
    const rot = tema.icone + '  ' + tema.pill + (dataAv ? ' · ' + formatarData(dataAv).slice(0,5) : '');
    ctx.font = "800 26px 'Baloo 2', sans-serif";
    const w = ctx.measureText(rot).width + 56;
    ctx.save(); retanguloArredondado(ctx, (W-w)/2, y, w, 48, 24);
    ctx.fillStyle = '#F2892B'; ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3; ctx.fill(); ctx.restore();
    ctx.fillStyle = '#fff'; ctx.fillText(rot, W/2, y + 33);
    y += hPill;
  }

  // título
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
  ctx.fillStyle = '#fff'; ctx.font = "800 " + t.tam + "px " + FAM_T;
  t.linhas.forEach(function(l, i){ ctx.fillText(l, W/2, y + t.tam*0.86 + i*t.tam*1.05); });
  ctx.restore();
  y += hT;
  // nome (aniversário)
  if(n.linhas.length){
    ctx.fillStyle = '#FFD166'; ctx.font = "700 " + n.tam + "px " + FAM_T;
    n.linhas.forEach(function(l, i){ ctx.fillText(l, W/2, y + n.tam*0.9 + i*n.tam*1.08); });
    y += hN;
  }
  // texto complementar
  if(s.linhas.length){
    ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.font = "600 " + s.tam + "px " + FAM_S;
    s.linhas.forEach(function(l, i){ ctx.fillText(l, W/2, y + 12 + s.tam + i*s.tam*1.3); });
  }
  // rodapé e mascote
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = "700 22px 'Nunito', sans-serif";
  ctx.fillText('AGITA · Ginástica Rítmica', W/2, H - 28);
  if(ginger){
    const gh = 290, gw = ginger.width*gh/ginger.height;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8;
    ctx.drawImage(ginger, W - gw - 18, H - gh - 4, gw, gh); ctx.restore();
  }
}

  const select = document.getElementById('mn-filtro-mes');

  const meses = [...new Set(mensalidadesCache.map(m=>m.mes_referencia))].sort().reverse();

    meses.map(m=>`<option value="${m}">${formatarMesReferencia(m)}</option>`).join('');
  select.value = filtroMesMensalidades;
}
function filtrarMensalidadesPorMes(){
  filtroMesMensalidades = document.getElementById('mn-filtro-mes').value;
  renderTabelaMensalidades();
}

async function lancarMensalidade(){
  const atletaId = document.getElementById('mn-atleta').value;
  const mes = document.getElementById('mn-mes').value;
  const valor = parseFloat(document.getElementById('mn-valor').value);
  const vencimento = document.getElementById('mn-vencimento').value;
  const desconto = document.getElementById('mn-desconto').checked;
  if(!atletaId || !mes || !valor || !vencimento){ mostrarToast('Preencha atleta, mês, valor e vencimento.'); return; }
  try{
    await api('mensalidades', {method:'POST', corpo:{atletaId, mesReferencia:mes, valor, vencimento, desconto}});
  }catch(e){ return; }
  document.getElementById('mn-valor').value=''; document.getElementById('mn-vencimento').value=''; document.getElementById('mn-desconto').checked=false;
  mensalidadesCache = (await api('mensalidades')).mensalidades;
  montarFiltroMesMensalidades();
  renderTabelaMensalidades();
}
async function lancarMensalidadesEmMassa(){
  const ano = parseInt(document.getElementById('mn-massa-ano').value);
  const diaVencimento = parseInt(document.getElementById('mn-massa-dia').value) || 10;
  if(!ano){ mostrarToast('Informe o ano.'); return; }
  let resultado;
  try{
    resultado = await api('mensalidades/gerar-ano', {method:'POST', corpo:{ano, diaVencimento, desconto:false}});
  }catch(e){ return; }
  mostrarToast(`${resultado.criadas} parcela(s) geradas. ${resultado.ignoradas} já existiam.`);
  mensalidadesCache = (await api('mensalidades')).mensalidades;
  montarFiltroMesMensalidades();
  renderTabelaMensalidades();
}
function marcarTodasMensalidades(){
  const caixas = [...document.querySelectorAll('.mn-selecionar')].filter(cx=>cx.closest('tr').style.display!=='none');
  if(caixas.length===0) return;
  const todasMarcadas = [...caixas].every(cx=>cx.checked);
  caixas.forEach(cx=>{ cx.checked = !todasMarcadas; });
}
async function excluirMensalidadesSelecionadas(){
  const ids = [...document.querySelectorAll('.mn-selecionar:checked')].filter(cx=>cx.closest('tr').style.display!=='none').map(cx=>cx.dataset.id);
  if(ids.length===0){ mostrarToast('Marque ao menos uma mensalidade para excluir.'); return; }
  for(const id of ids){
    try{ await api('mensalidades/'+id, {method:'DELETE'}); }catch(e){ /* segue para as próximas */ }
  }
  mostrarToast(`${ids.length} mensalidade(s) excluída(s).`);
  mensalidadesCache = (await api('mensalidades')).mensalidades;
  montarFiltroMesMensalidades();
  renderTabelaMensalidades();
}
function escaparTexto(t){
  return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function abrirEdicaoMensalidade(id){
  const m = mensalidadesCache.find(x=>x.id===id);
  if(!m) return;
  abrirModal(`
    <h3>Editar mensalidade</h3>
    <p style="margin-top:0;color:var(--texto-suave);">
      <strong>${escaparTexto(m.atleta_nome||'—')}</strong> — ${formatarMesReferencia(m.mes_referencia)}<br>
      Responsável: ${escaparTexto(m.responsavel||'—')}${m.telefone?' · '+escaparTexto(m.telefone):''}
    </p>
    <div class="linha-form">
      <div class="campo"><label>Vencimento</label><input type="date" id="me-vencimento" value="${escaparTexto(m.vencimento||'')}"></div>
      <div class="campo"><label>Valor (R$)</label><input type="number" step="0.01" id="me-valor" value="${escaparTexto(m.valor)}"></div>
    </div>
    <div class="campo"><label>Observação</label><textarea id="me-obs" rows="3" style="width:100%;font:inherit;padding:10px 12px;border:1px solid var(--linha);border-radius:10px;">${escaparTexto(m.observacao||'')}</textarea></div>
    <div class="barra-acoes">
      <button class="btn btn-primario" onclick="salvarEdicaoMensalidade('${m.id}')">Salvar</button>
      <button class="btn btn-secundario" onclick="fecharModal()">Cancelar</button>
    </div>
  `);
}
async function salvarEdicaoMensalidade(id){
  const vencimento = document.getElementById('me-vencimento').value;
  const valor = parseFloat(document.getElementById('me-valor').value);
  const observacao = document.getElementById('me-obs').value.trim();
  if(!vencimento){ mostrarToast('Informe o vencimento.'); return; }
  if(!(valor>0)){ mostrarToast('Informe um valor válido.'); return; }
  try{ await api('mensalidades/'+id, {method:'PUT', corpo:{vencimento, valor, observacao}}); }catch(e){ return; }
  fecharModal();
  mensalidadesCache = (await api('mensalidades')).mensalidades;
  montarFiltroMesMensalidades();
  renderTabelaMensalidades();
  mostrarToast('Mensalidade atualizada.');
}

async function marcarMensalidade(id, pago, valor){
  const corpo = pago ? {dataPagamento: new Date().toISOString().slice(0,10), valorPago: valor} : {dataPagamento:null, valorPago:null};
  try{ await api('mensalidades/'+id, {method:'PUT', corpo}); }catch(e){ return; }
  mensalidadesCache = (await api('mensalidades')).mensalidades;
  renderTabelaMensalidades();
}
async function excluirMensalidade(id){
  try{ await api('mensalidades/'+id, {method:'DELETE'}); }catch(e){ return; }
  mensalidadesCache = (await api('mensalidades')).mensalidades;
  montarFiltroMesMensalidades();
  renderTabelaMensalidades();
}

const __filtrosColunas = {};
function adicionarFiltrosColunas(alvo, chave){
  // Linha de filtros por coluna (texto ou lista) sob o cabeçalho; só esconde linhas, não recria a tabela
  if(!alvo) return;
  const tabela = alvo.querySelector('table');
  if(!tabela || !tabela.tHead || !tabela.tBodies[0]) return;
  const norm = t => String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
  const limpar = t => String(t||'').replace(/\s*\(\d+d\)\s*$/,'').replace(/\s+/g,' ').trim();
  const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  const colunasLista = ['Setor','Categoria','Status','Tipo','Papel','Status senha','Rateado?','Centro de custo','Mês'];
  const ths = [...tabela.tHead.rows[0].cells];
  const linhas = [...tabela.tBodies[0].rows];
  const estado = __filtrosColunas[chave] || (__filtrosColunas[chave] = {});
  const estilo = 'width:100%;min-width:90px;padding:6px 8px;font-size:.85rem;font-weight:400;';
  const celulas = ths.map((th,i)=>{
    const nome = th.textContent.trim();
    if(!nome) return '<th></th>';
    const guardado = estado[i] || '';
    if(colunasLista.includes(nome)){
      let valores = [...new Set(linhas.map(tr=>limpar(tr.cells[i].textContent)))].filter(v=>v && v!=='—');
      if(nome!=='Mês') valores.sort((a,b)=>a.localeCompare(b,'pt-BR'));
      return `<th><select data-col="${i}" data-tipo="lista" style="${estilo}"><option value="">Todos</option>${valores.map(v=>`<option value="${esc(v)}"${v===guardado?' selected':''}>${esc(v)}</option>`).join('')}</select></th>`;
    }
    return `<th><input type="search" data-col="${i}" data-tipo="texto" placeholder="Filtrar" value="${esc(guardado)}" style="${estilo}"></th>`;
  });
  const linhaFiltros = document.createElement('tr');
  linhaFiltros.innerHTML = celulas.join('');
  tabela.tHead.appendChild(linhaFiltros);

  const barra = document.createElement('div');
  barra.style.cssText = 'display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px;';
  barra.innerHTML = `<button class="btn btn-sm btn-secundario" type="button">Limpar filtros</button><span style="color:var(--texto-suave);font-size:.9rem;"></span>`;
  tabela.insertAdjacentElement('beforebegin', barra);
  const contador = barra.querySelector('span');

  const aplicar = () => {
    const filtros = [...linhaFiltros.querySelectorAll('[data-col]')]
      .map(el=>[+el.dataset.col, el.dataset.tipo, el.value]).filter(f=>f[2]);
    let visiveis = 0;
    linhas.forEach(r=>{
      const ok = filtros.every(([i,tipo,v])=>{
        const txt = r.cells[i].textContent;
        return tipo==='lista' ? limpar(txt)===v : norm(txt).includes(norm(v));
      });
      r.style.display = ok ? '' : 'none';
      if(ok) visiveis++;
      else r.querySelectorAll('input[type=checkbox]').forEach(cx=>{ cx.checked = false; }); // linha escondida nunca fica selecionada
    });
    contador.textContent = visiveis + ' de ' + linhas.length;
  };
  linhaFiltros.querySelectorAll('[data-col]').forEach(el=>{
    el.addEventListener(el.tagName==='SELECT' ? 'change' : 'input', ()=>{ estado[el.dataset.col] = el.value; aplicar(); });
  });
  barra.querySelector('button').addEventListener('click', ()=>{
    linhaFiltros.querySelectorAll('[data-col]').forEach(el=>{ el.value = ''; });
    Object.keys(estado).forEach(k=>delete estado[k]);
    aplicar();
  });
  aplicar();
}

let valoresMensalidadeCache = [];
async function renderFinanceiroValoresMensalidade(){
  const alvo = document.getElementById('financeiro-conteudo');
  alvo.innerHTML = `
    <div class="cartao">
      <p style="color:var(--texto-suave);margin-top:0;">Defina o valor de mensalidade de cada atleta (fica em branco até você preencher). Esse valor é usado no lançamento em massa do ano.</p>
      <div class="tabela-wrap" id="tabela-valores-mensalidade">Carregando...</div>
    </div>
  `;
  try{ valoresMensalidadeCache = (await api('valores-mensalidade')).atletas; }catch(e){ valoresMensalidadeCache = []; }
  renderTabelaValoresMensalidade();
}
function renderTabelaValoresMensalidade(){
  const alvo = document.getElementById('tabela-valores-mensalidade');
  if(valoresMensalidadeCache.length===0){ alvo.innerHTML = `<div class="vazio">Nenhuma atleta cadastrada ainda.</div>`; return; }
  const estiloFiltro = 'width:100%;padding:6px 8px;font-size:.85rem;font-weight:400;';
  alvo.innerHTML = `
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">
      <button class="btn btn-sm btn-secundario" onclick="limparFiltrosValoresMensalidade()">Limpar filtros</button>
      <span id="vm-contador" style="color:var(--texto-suave);font-size:.9rem;"></span>
    </div>
    <table>
      <thead>
        <tr><th>Nome</th><th>Responsável</th><th>Setor</th><th>Mensalidade</th><th>Observação</th><th></th></tr>
        <tr class="vm-linha-filtros">
          <th><input type="search" id="vm-f-nome" placeholder="Filtrar nome" style="${estiloFiltro}" oninput="aplicarFiltrosValoresMensalidade()"></th>
          <th><input type="search" id="vm-f-resp" placeholder="Filtrar responsável" style="${estiloFiltro}" oninput="aplicarFiltrosValoresMensalidade()"></th>
          <th>
            <select id="vm-f-setor" style="${estiloFiltro}" onchange="aplicarFiltrosValoresMensalidade()">
              <option value="">Todos os setores</option>
              <option value="ESCOLINHA">Escolinha</option>
              <option value="PRE-EQUIPE">Pré-equipe</option>
              <option value="ALTO RENDIMENTO">Alto rendimento</option>
              <option value="__sem">Sem setor</option>
            </select>
          </th>
          <th>
            <select id="vm-f-mens" style="${estiloFiltro}" onchange="aplicarFiltrosValoresMensalidade()">
              <option value="">Todas</option>
              <option value="preenchidas">Preenchidas</option>
              <option value="branco">Em branco</option>
            </select>
          </th>
          <th></th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${valoresMensalidadeCache.map(a=>`
          <tr data-setor="${a.setor||'__sem'}">
            <td>${a.nome}</td>
            <td>${a.responsavel||'—'}</td>
            <td>${formatarSetor(a.setor)}</td>
            <td><input type="number" step="0.01" id="vm-${a.id}" value="${a.valor_mensalidade!=null?a.valor_mensalidade:''}" placeholder="—" style="max-width:130px;"></td>
            <td><input type="text" id="vo-${a.id}" value="${escaparTexto(a.observacao_mensalidade||'')}" placeholder="Observação" style="min-width:220px;"></td>
            <td><button class="btn btn-sm btn-primario" onclick="salvarValorMensalidade('${a.id}')">Salvar</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  aplicarFiltrosValoresMensalidade();
}
function aplicarFiltrosValoresMensalidade(){
  // Só mostra/esconde linhas (não recria a tabela), para não perder valores digitados e ainda não salvos
  const norm = t => String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
  const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const fNome = norm(val('vm-f-nome')), fResp = norm(val('vm-f-resp'));
  const fSetor = val('vm-f-setor'), fMens = val('vm-f-mens');
  const linhas = document.querySelectorAll('#tabela-valores-mensalidade tbody tr');
  let visiveis = 0;
  linhas.forEach(tr=>{
    const preenchido = tr.querySelector('input').value !== '';
    const ok = norm(tr.cells[0].textContent).includes(fNome)
      && norm(tr.cells[1].textContent).includes(fResp)
      && (!fSetor || tr.dataset.setor === fSetor)
      && (!fMens || (fMens==='preenchidas' ? preenchido : !preenchido));
    tr.style.display = ok ? '' : 'none';
    if(ok) visiveis++;
  });
  const contador = document.getElementById('vm-contador');
  if(contador) contador.textContent = visiveis + ' de ' + linhas.length + ' atletas';
}
function limparFiltrosValoresMensalidade(){
  ['vm-f-nome','vm-f-resp','vm-f-setor','vm-f-mens'].forEach(id=>{ const el = document.getElementById(id); if(el) el.value = ''; });
  aplicarFiltrosValoresMensalidade();
}
async function salvarValorMensalidade(atletaId){
  const campo = document.getElementById('vm-'+atletaId);
  const valor = campo.value === '' ? null : parseFloat(campo.value);
  try{ await api('valores-mensalidade/'+atletaId, {method:'PUT', corpo:{valor, observacao: (document.getElementById('vo-'+atletaId)||{value:''}).value}}); }catch(e){ return; }
  mostrarToast('Mensalidade da atleta atualizada.');
  const item = valoresMensalidadeCache.find(a=>a.id===atletaId);
  if(item){ item.valor_mensalidade = valor; item.observacao_mensalidade = (document.getElementById('vo-'+atletaId)||{value:''}).value.trim() || null; }
}

            </tr>
          `).join('')}
        </tbody>
      </table>
    </div></div>
  `;

/* ---------- RATEIO (calculadora — não grava nada no servidor) ---------- */
function renderFinanceiroRateio(){
  const alvo = document.getElementById('financeiro-conteudo');
  alvo.innerHTML = `
    <div class="cartao">
      <p style="color:var(--texto-suave);margin-top:0;">Simule o valor por atleta dividindo os custos de um evento (campeonato, viagem etc.) pelo número de atletas participantes.</p>
      <div class="linha-form">
        <div class="campo"><label>Nº de atletas</label><input type="number" id="rt-qtd" value="6" min="1" oninput="calcularRateio()"></div>
        <div class="campo"><label>Custo total (R$)</label><input type="number" step="0.01" id="rt-total" value="0" oninput="calcularRateio()"></div>
        <div class="campo"><label>Margem de imprevistos (%)</label><input type="number" id="rt-margem" value="10" oninput="calcularRateio()"></div>
        <div class="campo"><label>Subsídio do clube (R$)</label><input type="number" step="0.01" id="rt-subsidio" value="0" oninput="calcularRateio()"></div>
      </div>
      <div id="rt-resultado" class="cartao" style="background:var(--bg-suave, #f6f3ee);margin-top:6px;"></div>
    </div>
  `;
  calcularRateio();
}
function calcularRateio(){
  const qtd = Math.max(1, parseInt(document.getElementById('rt-qtd').value)||1);
  const total = parseFloat(document.getElementById('rt-total').value)||0;
  const margem = parseFloat(document.getElementById('rt-margem').value)||0;
  const subsidio = parseFloat(document.getElementById('rt-subsidio').value)||0;
  const totalComMargem = total * (1 + margem/100);
  const totalLiquido = Math.max(0, totalComMargem - subsidio);
  const porAtleta = totalLiquido / qtd;
  const linhasSimulacao = [];
  for(let n=Math.max(1,qtd-3); n<=qtd+4; n++){
    linhasSimulacao.push({n, valor: totalLiquido / n, atual: n===qtd});
  }
  document.getElementById('rt-resultado').innerHTML = `
    <p style="margin:0 0 8px;"><strong>Custo total com margem:</strong> ${formatarMoeda(totalComMargem)}</p>
    <p style="margin:0 0 8px;"><strong>Custo líquido (após subsídio):</strong> ${formatarMoeda(totalLiquido)}</p>
    <p style="margin:0 0 14px;font-size:1.3rem;"><strong>Valor por atleta (${qtd}):</strong> <span style="color:var(--laranja-forte);">${formatarMoeda(porAtleta)}</span></p>
    <p style="margin:0 0 6px;color:var(--texto-suave);">Parcelado: 2x de ${formatarMoeda(porAtleta/2)} · 3x de ${formatarMoeda(porAtleta/3)} · 4x de ${formatarMoeda(porAtleta/4)}</p>
    <table style="margin-top:10px;">
      <thead><tr><th>Nº de atletas</th><th>Valor por atleta</th></tr></thead>
      <tbody>
        ${linhasSimulacao.map(l=>`<tr style="${l.atual?'font-weight:700;background:rgba(242,137,43,0.12);':''}"><td>${l.n}</td><td>${formatarMoeda(l.valor)}</td></tr>`).join('')}
      </tbody>
    </table>
  `;
}

let perfilEditandoId = null;
function abrirAlterarPerfil(id){
  if(!usuarioLogado || usuarioLogado.papel !== 'admin') return;
  const u = usuariosCache.find(function(x){ return x.id === id; });
  if(!u) return;
  perfilEditandoId = id;
  const opt = function(v){ return '<option value="'+v+'"'+(u.papel===v ? ' selected' : '')+'>'+rotuloPapel(v)+'</option>'; };
  abrirModal(
    '<h3>Alterar perfil</h3>'
    + '<p style="margin-top:0;">'+escaparTexto(u.nome)+' · perfil atual: <b>'+rotuloPapel(u.papel)+'</b></p>'
    + '<div class="campo"><label>Novo perfil</label><select id="pf-papel">'+opt('usuario')+opt('tecnica')+opt('diretoria')+opt('financeiro')+opt('admin')+'</select></div>'

async function salvarAlterarPerfil(){
  const papel = document.getElementById('pf-papel').value;
  try{ await api('usuarios/'+perfilEditandoId, {method:'PUT', corpo:{papel:papel}}); }catch(e){ return; }
  fecharModal();

  mostrarToast('Perfil alterado para '+rotuloPapel(papel)+'.');
}

async function resetarSenha(id){
  const u = usuariosCache.find(x=>x.id===id);

  try{
    await api('usuarios/'+id+'/resetar-senha', {method:'POST'});

async function excluirUsuario(id){
  if(id===usuarioLogado.id){ mostrarToast('Você não pode excluir o usuário com o qual está logado.'); return; }
  if(!confirm('Excluir este usuário?')) return;
  try{ await api('usuarios/'+id, {method:'DELETE'}); }catch(e){ return; }
  await carregarUsuarios();
}

  function falar(el, texto, ms){
    if(!el) return;
    const b = el.querySelector('.ginger-balao');
    if(!b) return;
    b.textContent = texto;
    el.classList.add('fala');
    clearTimeout(el.__tf);
    el.__tf = setTimeout(function(){ el.classList.remove('fala'); }, ms || 3800);
  }
  function pular(el){
    if(!el || reduz) return;
    el.classList.remove('pulo');

    const d = document.createElement('div');
    d.className = 'deco-ginastica';
    d.setAttribute('aria-hidden','true');
    d.innerHTML = html;
    document.body.insertBefore(d, document.body.firstChild);
  }

  /* ---------- confete em explosão ---------- */
  function confeteBurst(x, y, qtd, modo){
    if(reduz) return;
    const wrap = document.createElement('div');
    wrap.className = 'confete-burst';
    wrap.style.left = x+'px';
    wrap.style.top = y+'px';
    document.body.appendChild(wrap);
    for(let i=0;i<(qtd||34);i++){
      const p = document.createElement('i');
      const w = rnd(6,12), h = Math.random()<.5 ? w : w*2.2;
      p.style.cssText = 'width:'+w+'px;height:'+h+'px;background:'+CORES[i%CORES.length];
      wrap.appendChild(p);
      const ang = modo==='cima' ? -Math.PI*Math.random() : Math.random()*Math.PI*2;
      const dist = rnd(90,260);
      const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist;
      p.animate([
        {transform:'translate(0,0) rotate(0deg)', opacity:1},
        {transform:'translate('+dx+'px,'+dy+'px) rotate('+rnd(90,360)+'deg)', opacity:1, offset:.45},
        {transform:'translate('+(dx*1.15)+'px,'+(dy+rnd(240,380))+'px) rotate('+rnd(400,900)+'deg)', opacity:0}
      ], {duration:rnd(1300,2000), easing:'cubic-bezier(.2,.7,.4,1)', fill:'forwards'});
    }
    setTimeout(function(){ wrap.remove(); }, 2400);
  }
  window.confeteBurst = confeteBurst;

  /* ---------- Ginger: login, rosto no topo, guia flutuante ---------- */
  let gLogin = null, gGuia = null, gTopo = null;
  function criarGingers(){
    const login = document.getElementById('tela-login');
    if(login && !gLogin){
      gLogin = document.createElement('div');
      gLogin.className = 'ginger-login';
      gLogin.setAttribute('role','img');
      gLogin.setAttribute('aria-label','Ginger, a raposa mascote do AGITA');
      gLogin.innerHTML = '<div class="ginger-balao"></div><div class="g-img"></div>';
      login.appendChild(gLogin);
      gLogin.addEventListener('click', function(){ aoClicarGinger(gLogin); });
    }
    if(!gGuia){
      gGuia = document.createElement('div');
      gGuia.className = 'ginger-guia';
      gGuia.setAttribute('role','button');
      gGuia.setAttribute('aria-label','Ginger, a raposa mascote do AGITA');
      gGuia.tabIndex = 0;
      gGuia.innerHTML = '<div class="ginger-balao"></div><div class="ginger-palco"><div class="ginger-corpo"></div></div>';
      document.body.appendChild(gGuia);
      gGuia.addEventListener('click', function(){ aoClicarGinger(gGuia); });
      gGuia.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); aoClicarGinger(gGuia); } });
      gGuia.addEventListener('mouseenter', function(){ falar(gGuia, FALAS[document.body.dataset.secao] || FALAS.inicio, 3200); });
    }
    const esq = document.querySelector('.topo-esquerda');
    if(esq && !gTopo){
      gTopo = document.createElement('div');
      gTopo.className = 'g-rosto';
      gTopo.title = 'Oi, eu sou a Ginger!';
      esq.appendChild(gTopo);
      const balao = document.createElement('div');
      balao.className = 'ginger-balao';
      esq.appendChild(balao);
      gTopo.addEventListener('click', function(){ pular(gTopo); falar(esq, sorteia(TORCIDA), 2600); const r=gTopo.getBoundingClientRect(); confeteBurst(r.left+r.width/2, r.top+r.height/2, 22, 'radial'); });
    }
  }
  // olhar acompanha o mouse (rosto do topo)
  let olharPend = false;
  document.addEventListener('mousemove', function(e){
    if(olharPend || !gTopo || reduz) return;
    olharPend = true;
    requestAnimationFrame(function(){
      olharPend = false;
      const r = gTopo.getBoundingClientRect();
      const dx = Math.max(-1, Math.min(1, (e.clientX - (r.left+r.width/2)) / 400));
      const dy = Math.max(-1, Math.min(1, (e.clientY - (r.top+r.height/2)) / 400));
      gTopo.style.setProperty('--olx', (dx*4).toFixed(1)+'px');
      gTopo.style.setProperty('--oly', (dy*3).toFixed(1)+'px');
    });
  });

  /* ---------- Ginger no cabeçalho do Início ---------- */
  function garantirHeroInicio(){
    if(document.body.dataset.secao !== 'inicio') return;
    const cab = document.querySelector('.marca-dagua-inicio .cabecalho-secao');
    if(!cab || cab.querySelector('.ginger-hero')) return;
    const nome = (typeof usuarioLogado !== 'undefined' && usuarioLogado && usuarioLogado.nome) ? usuarioLogado.nome.split(' ')[0] : '';
    const h = document.createElement('div');
    h.className = 'ginger-hero';
    h.setAttribute('role','img');
    h.setAttribute('aria-label','Ginger, a raposa mascote do AGITA');
    h.innerHTML = '<div class="ginger-balao"></div><div class="g-img"></div>';
    cab.appendChild(h);
    h.addEventListener('click', function(){ aoClicarGinger(h); });
    setTimeout(function(){ falar(h, gingerBoasVindas(nome), 4800); }, 1100);
  }

  /* ---------- transição de entrada das páginas ---------- */
  let tEntrada;
  function animarEntradaPagina(){
    const m = document.getElementById('conteudo');
    if(!m) return;
    m.classList.remove('pagina-entra');
    void m.offsetWidth;
    m.classList.add('pagina-entra');
    clearTimeout(tEntrada);
    tEntrada = setTimeout(function(){ m.classList.remove('pagina-entra'); }, 3000);
  }
  const irParaOrig = window.irPara;
  if(typeof irParaOrig === 'function'){
    window.irPara = function(secao){
      document.body.dataset.secao = secao;
      const r = irParaOrig.apply(this, arguments);
      animarEntradaPagina();
      if(secao !== 'inicio' && gGuia) setTimeout(function(){ falar(gGuia, FALAS[secao] || '', 3400); }, 1000);
      return r;
    };
  }

  /* ---------- tela atual (login x app) ---------- */
  function atualizarTela(){
    const app = document.getElementById('app');
    const novo = (app && getComputedStyle(app).display !== 'none') ? 'app' : 'login';
    const anterior = document.body.dataset.tela;
    if(anterior === novo) return;
    document.body.dataset.tela = novo;
    if(novo === 'app'){
      if(!document.body.dataset.secao) document.body.dataset.secao = 'inicio';
      animarEntradaPagina();
      criarGingers();
      if(anterior === 'login') setTimeout(function(){ confeteBurst(window.innerWidth/2, 80, 48, 'radial'); }, 400);
    } else {
      delete document.body.dataset.secao;
      document.querySelectorAll('.ginger-hero').forEach(function(h){ h.remove(); });
      if(gLogin) setTimeout(function(){ falar(gLogin, 'Oi! Eu sou a Ginger 🦊 Bora treinar com a gente?', 5200); }, 1900);
    }
  }

  /* ---------- números do Início contam de 0 ---------- */
  function animarNumeros(){
    document.querySelectorAll('body[data-secao="inicio"] .cartao-atalho .numero:not([data-ok])').forEach(function(el){
      el.dataset.ok = '1';
      const txt = el.textContent.trim();
      if(!/^\d+$/.test(txt) || !el.firstChild) return;
      const alvo = parseInt(txt, 10);
      if(alvo === 0 || reduz) return;
      const ini = performance.now(), dur = 800 + Math.min(alvo, 200)*3;
      el.firstChild.nodeValue = '0';
      const passo = function(agora){
        const p = Math.min(1, (agora-ini)/dur);
        el.firstChild.nodeValue = String(Math.round(alvo*(1-Math.pow(1-p,3))));
        if(p < 1) requestAnimationFrame(passo);
      };
      requestAnimationFrame(passo);
    });
  }

  /* ---------- ondinha (ripple) nos botões ---------- */
  document.addEventListener('pointerdown', function(e){
    if(reduz || !e.target.closest) return;
    const b = e.target.closest('.btn');
    if(!b) return;
    const r = b.getBoundingClientRect();
    const d = Math.max(r.width, r.height);
    const s = document.createElement('span');
    s.className = 'ripple';
    s.style.width = s.style.height = d+'px';
    s.style.left = (e.clientX - r.left - d/2)+'px';
    s.style.top = (e.clientY - r.top - d/2)+'px';
    b.appendChild(s);
    setTimeout(function(){ s.remove(); }, 700);
  });

  /* ---------- aviso (toast) de sucesso: confete + Ginger comemora ---------- */
  const toastOrig = window.mostrarToast;
  if(typeof toastOrig === 'function'){
    window.mostrarToast = function(msg){
      const r = toastOrig.apply(this, arguments);
      if(/(sucesso|atualizad|salv[oa]|confirmad|publicad|lançad|gerad|criad|cadastrad|enviad|registrad)/i.test(String(msg||''))){
        const t = document.getElementById('toast');
        if(t){ const b = t.getBoundingClientRect(); confeteBurst(b.left + b.width/2, b.top, 30, 'cima'); }
        if(gGuia){ pular(gGuia); falar(gGuia, 'Mandou bem! 🎉', 2400); }
      }
      return r;
    };
  }

  criarDecoracao();
  criarGingers();
  atualizarTela();
  const app = document.getElementById('app');
  if(app) new MutationObserver(atualizarTela).observe(app, {attributes:true, attributeFilter:['style','class']});
  const conteudo = document.getElementById('conteudo');
  if(conteudo){
    let agendado = false;
    new MutationObserver(function(){
      if(agendado) return;
      agendado = true;
      requestAnimationFrame(function(){ agendado = false; animarNumeros(); garantirHeroInicio(); criarGingers(); });
    }).observe(conteudo, {childList:true, subtree:true});
  }
  animarNumeros();
  garantirHeroInicio();
  if(document.body.dataset.tela === 'login' && gLogin) setTimeout(function(){ falar(gLogin, 'Oi! Eu sou a Ginger 🦊 Bora treinar com a gente?', 5200); }, 1900);
})();
</script>
</body>
