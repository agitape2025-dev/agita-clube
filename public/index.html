  const c = document.getElementById('conteudo');
  if(!podeGerenciar()) chamadaAba = 'frequencia';
  if(!chamadaData) chamadaData = hojeISO();
  c.innerHTML = `
    <div class="cabecalho-secao">
      <div><h2>Chamada</h2><p>Registre as faltas do treino e acompanhe a frequência das atletas.</p></div>
    </div>
    ${podeGerenciar() ? `
    <div class="abas-chamada">
      <button type="button" id="aba-chamada-fazer" class="btn" onclick="trocarAbaChamada('fazer')">✅ Fazer chamada</button>
      <button type="button" id="aba-chamada-frequencia" class="btn" onclick="trocarAbaChamada('frequencia')">📊 Frequência</button>
    </div>` : ''}
    <div id="chamada-corpo"></div>
  `;
  trocarAbaChamada(chamadaAba);
}
function trocarAbaChamada(aba){
  chamadaAba = aba;
  ['fazer','frequencia'].forEach(k=>{
    const b = document.getElementById('aba-chamada-'+k);
    if(b){ b.classList.toggle('btn-primario', k===aba); b.classList.toggle('btn-secundario', k!==aba); }
  });
  if(aba==='fazer') renderFazerChamada(); else renderFrequencia();
}

/* ---------- fazer chamada ---------- */
function renderFazerChamada(){
  const corpo = document.getElementById('chamada-corpo');
  corpo.innerHTML = `
    <div class="cartao">
      <div class="linha-filtros-chamada">
        <div class="campo"><label>Data do treino</label><input type="date" id="chamada-data" value="${chamadaData}" onchange="chamadaMudouData(this.value)"></div>
        <div class="campo"><label>Buscar atleta</label><input type="text" id="chamada-busca" placeholder="Nome..." oninput="desenharListaChamada()"></div>
      </div>
      <div class="chips-setor" id="chamada-chips"></div>
    </div>
    <div class="cartao">
      <div id="chamada-resumo"></div>
      <div id="chamada-lista">Carregando...</div>
    </div>
  `;
  carregarChamada();
}
async function carregarChamada(){
  try{
    const d = await api('chamada?data='+encodeURIComponent(chamadaData));
    chamadaCache = d.atletas || [];
  }catch(e){ chamadaCache = []; }
  chamadaFaltas = new Set(chamadaCache.filter(a=>a.status==='F').map(a=>a.id));
  chamadaJaRegistrada = chamadaCache.some(a=>a.status);
  const ch = document.getElementById('chamada-chips');
  if(ch) ch.innerHTML = chipsSetorChamada(chamadaSetor, 'mudarSetorChamada');
  desenharListaChamada();
}
function chamadaMudouData(v){
  if(!v) return;
  chamadaData = v;
  carregarChamada();
}
function mudarSetorChamada(k){
  chamadaSetor = k;
  const ch = document.getElementById('chamada-chips');
  if(ch) ch.innerHTML = chipsSetorChamada(chamadaSetor, 'mudarSetorChamada');
  desenharListaChamada();
}
function listaVisivelChamada(){
  const busca = (document.getElementById('chamada-busca')?.value || '').toLowerCase();
  return chamadaCache.filter(a=>
    (chamadaSetor==='todos' || a.setor===chamadaSetor) && (a.nome||'').toLowerCase().includes(busca)
  );
}
function desenharListaChamada(){
  const alvo = document.getElementById('chamada-lista');
  if(!alvo) return;
  const lista = listaVisivelChamada();
  if(lista.length===0){
    alvo.innerHTML = `<div class="vazio">Nenhuma atleta encontrada neste setor.</div>`;
    atualizarResumoChamada();
    return;
  }
  alvo.innerHTML = `<div class="lista-chamada">` + lista.map(a=>{
    const falta = chamadaFaltas.has(a.id);
    return `
      <label class="linha-chamada ${falta?'faltou':''}">
        <input type="checkbox" ${falta?'checked':''} onchange="alternarFaltaChamada('${a.id}', this)">
        <span class="nome-chamada">${escaparTexto(a.nome)}</span>
        <span class="tag-setor-chamada">${formatarSetor(a.setor)}</span>
        <span class="selo-chamada">${falta?'FALTOU':'Presente'}</span>
      </label>`;
  }).join('') + `</div>`;
  atualizarResumoChamada();
}
function alternarFaltaChamada(id, el){
  if(el.checked) chamadaFaltas.add(id); else chamadaFaltas.delete(id);
  const linha = el.closest('.linha-chamada');
  if(linha){
    linha.classList.toggle('faltou', el.checked);
    const selo = linha.querySelector('.selo-chamada');
    if(selo) selo.textContent = el.checked ? 'FALTOU' : 'Presente';
  }
  atualizarResumoChamada();
}
function atualizarResumoChamada(){
  const alvo = document.getElementById('chamada-resumo');
  if(!alvo) return;
  const lista = listaVisivelChamada();
  const faltas = lista.filter(a=>chamadaFaltas.has(a.id)).length;
  const pres = lista.length - faltas;
  alvo.innerHTML = `
    <div class="resumo-chamada">
      <div class="contadores-chamada">
        <span class="cont ok">${pres} presente${pres===1?'':'s'}</span>
        <span class="cont falta">${faltas} falta${faltas===1?'':'s'}</span>
        <span class="cont total">${lista.length} na lista</span>
      </div>
      <div class="acoes-chamada">
        <button type="button" class="btn btn-secundario btn-sm" onclick="limparFaltasChamada()">Todas presentes</button>
        <button type="button" class="btn btn-primario" onclick="salvarChamada()" ${lista.length?'':'disabled'}>💾 Salvar chamada</button>
      </div>
    </div>
    ${chamadaJaRegistrada ? `<p class="aviso-chamada">Já existe chamada registrada nesta data. Ao salvar, ela será atualizada.</p>` : ''}
    <p class="dica-chamada">Marque apenas as atletas que <strong>faltaram</strong>. As demais ficam como presentes.</p>
  `;
}
function limparFaltasChamada(){
  listaVisivelChamada().forEach(a=>chamadaFaltas.delete(a.id));
  desenharListaChamada();
}
async function salvarChamada(){
  const lista = listaVisivelChamada();
  if(lista.length===0){ mostrarToast('Nenhuma atleta na lista.'); return; }
  const faltas = lista.filter(a=>chamadaFaltas.has(a.id)).map(a=>a.id);
  try{
    await api('chamada', {method:'PUT', corpo:{data:chamadaData, atletas:lista.map(a=>a.id), faltas}});
    lista.forEach(a=>{ a.status = chamadaFaltas.has(a.id) ? 'F' : 'P'; });
    chamadaJaRegistrada = true;
    atualizarResumoChamada();
    mostrarToast('Chamada salva com sucesso! '+faltas.length+' falta(s) em '+lista.length+' atletas.');
  }catch(e){}
}

/* ---------- frequência ---------- */
function renderFrequencia(){
  const corpo = document.getElementById('chamada-corpo');
  const hoje = hojeISO();
  const ini = hoje.slice(0,8)+'01';
  corpo.innerHTML = `
    <div class="cartao">
      <div class="linha-filtros-chamada">
        <div class="campo"><label>De</label><input type="date" id="freq-de" value="${ini}"></div>
        <div class="campo"><label>Até</label><input type="date" id="freq-ate" value="${hoje}"></div>
        <div class="campo" style="align-self:end;"><button type="button" class="btn btn-primario" onclick="carregarFrequencia()">Gerar relatório</button></div>
      </div>
      <div class="chips-setor" id="freq-chips">${chipsSetorChamada(freqSetor,'mudarSetorFreq')}</div>
    </div>
    <div class="cartao">
      <div id="freq-resumo"></div>
      <div class="tabela-wrap" id="freq-tabela">Carregando...</div>
    </div>
  `;
  carregarFrequencia();
}
async function carregarFrequencia(){
  const de = document.getElementById('freq-de')?.value;
  const ate = document.getElementById('freq-ate')?.value;
  if(!de || !ate){ mostrarToast('Informe o período.'); return; }
  try{
    const d = await api('chamada/relatorio?de='+encodeURIComponent(de)+'&ate='+encodeURIComponent(ate));
    freqDados = d.atletas || [];
    freqAulas = d.aulas || 0;
  }catch(e){ freqDados = []; freqAulas = 0; }
  desenharFrequencia();
}
function mudarSetorFreq(k){
  freqSetor = k;
  const ch = document.getElementById('freq-chips');
  if(ch) ch.innerHTML = chipsSetorChamada(freqSetor,'mudarSetorFreq');
  desenharFrequencia();
}
function listaFrequencia(){
  return freqDados.filter(a=> freqSetor==='todos' || a.setor===freqSetor);
}
function pctFreq(a){
  const t = (a.presencas||0) + (a.faltas||0);
  return t ? Math.round((a.presencas||0)*100/t) : null;
}
function desenharFrequencia(){
  const alvo = document.getElementById('freq-tabela');
  const res = document.getElementById('freq-resumo');
  if(!alvo) return;
  const lista = listaFrequencia();
  const comReg = lista.filter(a=>pctFreq(a)!==null);
  const media = comReg.length ? Math.round(comReg.reduce((s,a)=>s+pctFreq(a),0)/comReg.length) : null;
  res.innerHTML = `
    <div class="resumo-chamada">
      <div class="contadores-chamada">
        <span class="cont total">${freqAulas} dia${freqAulas===1?'':'s'} de chamada</span>
        <span class="cont ok">Frequência média: ${media===null?'—':media+'%'}</span>
      </div>
      <div class="acoes-chamada">
        <button type="button" class="btn btn-secundario btn-sm" onclick="baixarCsvFrequencia()">⬇ Baixar CSV</button>
        <button type="button" class="btn btn-secundario btn-sm" onclick="imprimirFrequencia()">🖨 Imprimir / PDF</button>
      </div>
    </div>`;
  if(lista.length===0){ alvo.innerHTML = `<div class="vazio">Nenhuma atleta neste setor.</div>`; return; }
  alvo.innerHTML = `
    <table>
      <thead><tr><th>Atleta</th><th>Setor</th><th>Presenças</th><th>Faltas</th><th>Frequência</th></tr></thead>
      <tbody>
        ${lista.map(a=>{
          const p = pctFreq(a);
          const cor = p===null ? '' : (p>=75 ? 'alta' : (p>=50 ? 'media' : 'baixa'));
          return `<tr>
            <td>${escaparTexto(a.nome)}</td>
            <td>${formatarSetor(a.setor)}</td>
            <td>${a.presencas||0}</td>
            <td>${a.faltas||0}</td>
            <td>${p===null ? '—' : `<div class="barra-freq"><div class="barra-freq-fill ${cor}" style="width:${p}%"></div><span>${p}%</span></div>`}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  adicionarFiltrosColunas(alvo, 'chamada-frequencia');
}
function linhasRelatorioFreq(){
  return listaFrequencia().map(a=>{
    const p = pctFreq(a);
    return [a.nome, formatarSetor(a.setor), a.presencas||0, a.faltas||0, p===null ? '' : p+'%'];
  });
}
function baixarCsvFrequencia(){
  const de = document.getElementById('freq-de')?.value || '';
  const ate = document.getElementById('freq-ate')?.value || '';
  const linhas = [['Atleta','Setor','Presenças','Faltas','Frequência']].concat(linhasRelatorioFreq());
  const csv = '﻿' + linhas.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'frequencia_'+de+'_a_'+ate+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function imprimirFrequencia(){
  const de = document.getElementById('freq-de')?.value || '';
  const ate = document.getElementById('freq-ate')?.value || '';
  const setor = SETORES_CHAMADA.find(s=>s[0]===freqSetor)?.[1] || 'Todos';
  const linhas = linhasRelatorioFreq();
  const w = window.open('', '_blank');
  if(!w){ mostrarToast('Permita pop-ups para imprimir o relatório.'); return; }
  w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Frequência AGITA</title>
    <style>body{font-family:Arial,sans-serif;padding:24px;color:#132A52}h1{font-size:20px;margin:0 0 4px}p{margin:0 0 14px;color:#555;font-size:13px}
    table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #ccc;padding:6px 8px;text-align:left}th{background:#F2892B;color:#fff}tr:nth-child(even) td{background:#fafafa}</style></head><body>
    <h1>AGITA — Relatório de frequência</h1>
    <p>Período: ${formatarData(de)} a ${formatarData(ate)} · Setor: ${setor} · ${freqAulas} dia(s) de chamada</p>
    <table><thead><tr><th>Atleta</th><th>Setor</th><th>Presenças</th><th>Faltas</th><th>Frequência</th></tr></thead><tbody>
    ${linhas.map(l=>'<tr>'+l.map(v=>'<td>'+escaparTexto(String(v))+'</td>').join('')+'</tr>').join('')}
    </tbody></table><script>window.onload=function(){window.print();}<\/script></body></html>`);
  w.document.close();
}


/* ================================================================
   APP (PWA) + NOTIFICAÇÕES + MURAL DE AVISOS
   ================================================================ */
let promptInstalacao = null;
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); promptInstalacao = e; atualizarCartaoPush(); });
window.addEventListener('appinstalled', function(){ promptInstalacao = null; atualizarCartaoPush(); });
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js').catch(function(){}); });
}
function ehIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function emModoApp(){
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
}
function pushSuportado(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
function b64uParaBytes(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length % 4) s += '=';
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function secaoInicial(){
  const s = new URLSearchParams(location.search).get('secao');
  return s === 'avisos' ? 'avisos' : 'inicio';
}
async function estadoPush(){
  if(ehIOS() && !emModoApp()) return 'ios-instalar';
  if(!pushSuportado()) return 'sem-suporte';
  if(Notification.permission==='denied') return 'bloqueado';
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(sub && Notification.permission==='granted') return 'ativo';
  }catch(e){}
  return 'inativo';
}
async function ativarNotificacoes(){
  try{
    const perm = await Notification.requestPermission();
    if(perm!=='granted'){
      mostrarToast('Notificações não permitidas. Libere nas configurações do navegador.');
      atualizarCartaoPush();
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      const r = await api('push/chave');
      sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64uParaBytes(r.chave)});
    }
    await api('push/inscrever', {method:'POST', corpo:{endpoint:sub.endpoint}});
    mostrarToast('Notificações ativadas com sucesso!');
  }catch(e){
    mostrarToast('Não foi possível ativar as notificações neste aparelho.');
  }
  atualizarCartaoPush();
}
async function desativarNotificacoes(){
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      try{ await api('push/cancelar', {method:'POST', corpo:{endpoint:sub.endpoint}}); }catch(e){}
      await sub.unsubscribe();
    }
    mostrarToast('Notificações desativadas neste aparelho.');
  }catch(e){}
  atualizarCartaoPush();
}
async function instalarApp(){
  if(!promptInstalacao) return;
  promptInstalacao.prompt();
  try{ await promptInstalacao.userChoice; }catch(e){}
  promptInstalacao = null;
  atualizarCartaoPush();
}
async function atualizarCartaoPush(){
  const alvo = document.getElementById('cartao-push');
  if(!alvo) return;
  const compacto = alvo.dataset.modo === 'inicio';
  const st = await estadoPush();
  const btnInstalar = (promptInstalacao && !emModoApp())
    ? `<button type="button" class="btn btn-secundario" onclick="instalarApp()">📲 Instalar app</button>` : '';
  let html = '';
  if(st==='ativo'){
    html = compacto ? '' : `
      <div class="cartao-push ok">
        <div class="txt"><strong>🔔 Notificações ativadas</strong>Você será avisada(o) aqui neste aparelho sempre que o AGITA publicar um aviso.</div>
        <div class="acoes"><button type="button" class="btn btn-secundario btn-sm" onclick="desativarNotificacoes()">Desativar</button>${btnInstalar}</div>
      </div>`;
  } else if(st==='inativo'){
    html = `
      <div class="cartao-push">
        <div class="txt"><strong>🔔 Receba os avisos no celular</strong>Ative as notificações e seja avisada(o) na hora quando o AGITA publicar um comunicado.</div>
        <div class="acoes"><button type="button" class="btn btn-primario" onclick="ativarNotificacoes()">Ativar notificações</button>${btnInstalar}</div>
      </div>`;
  } else if(st==='ios-instalar'){
    html = `
      <div class="cartao-push">
        <div class="txt"><strong>📲 Instale o app no iPhone</strong>Toque em <b>Compartilhar</b> (o quadrado com a seta) e depois em <b>Adicionar à Tela de Início</b>. Abra o app AGITA pelo novo ícone e ative as notificações.</div>
      </div>`;
  } else if(st==='bloqueado'){
    html = compacto ? '' : `
      <div class="cartao-push">
        <div class="txt"><strong>🔕 Notificações bloqueadas</strong>Libere as notificações do AGITA nas configurações do navegador deste aparelho e volte aqui.</div>
      </div>`;
  } else if(btnInstalar){
    html = `<div class="cartao-push"><div class="txt"><strong>📲 Instale o app AGITA</strong>Tenha o portal na tela inicial do seu aparelho.</div><div class="acoes">${btnInstalar}</div></div>`;
  }
  alvo.innerHTML = html;
}
/* envia a notificação em lotes depois de publicar um aviso */
async function enviarPushAviso(publico){
  let desloc = 0, enviadas = 0, total = 0;
  try{
    for(let i=0;i<30;i++){
      const r = await api('push/enviar', {method:'POST', corpo:{deslocamento:desloc, publico:publico || 'todos'}});
      enviadas += r.enviadas || 0; total = r.total || 0;
      if(r.proximo === null || r.proximo === undefined) break;
      desloc = r.proximo;
    }
    if(total>0) mostrarToast('Notificação enviada para '+enviadas+' de '+total+' aparelho(s).');
  }catch(e){}
}

/* ---------- avisos "novos" (selo e bolinha no menu) ---------- */
function msAviso(iso){ return Date.parse(iso) || 0; }
function lerVistoAvisos(){
  try{
    const v = localStorage.getItem('agita_avisos_visto');
    if(v) return Number(v) || 0;
    localStorage.setItem('agita_avisos_visto', String(Date.now()));
  }catch(e){}
  return Date.now();
}
function gravarVistoAvisos(){
  try{ localStorage.setItem('agita_avisos_visto', String(Date.now())); }catch(e){}
  atualizarBadgeAvisos(0);
}
async function atualizarBadgeAvisos(forcar){
  let n = 0;
  if(forcar === undefined){
    try{ const d = await api('avisos/contagem?desde='+lerVistoAvisos()); n = d.novos || 0; }catch(e){ return; }
  } else { n = forcar; }
  document.querySelectorAll('#menu-desktop button[data-secao="avisos"], #menu-mobile button[data-secao="avisos"]').forEach(function(b){
    let s = b.querySelector('.bolinha-novo');
    if(n>0){
      if(!s){ s = document.createElement('span'); s.className = 'bolinha-novo'; b.appendChild(s); }
      s.textContent = n>9 ? '9+' : String(n);
    } else if(s){ s.remove(); }
  });
  try{
    if('setAppBadge' in navigator){ if(n>0) navigator.setAppBadge(n).catch(function(){}); else navigator.clearAppBadge().catch(function(){}); }
  }catch(e){}
}
setInterval(function(){
  if(typeof usuarioLogado !== 'undefined' && usuarioLogado && !document.hidden && typeof secaoAtual !== 'undefined' && secaoAtual !== 'avisos') atualizarBadgeAvisos();
}, 60000);

/* ---------- mural de avisos (visão dos pais) ---------- */
function gingerVazia(el){
  el.classList.remove('pulo'); void el.offsetWidth; el.classList.add('pulo');
  setTimeout(function(){ el.classList.remove('pulo'); }, 900);
  const r = el.getBoundingClientRect();
  if(window.confeteBurst) window.confeteBurst(r.left + r.width/2, r.top + 70, 26, 'cima');
}
function renderMuralPais(alvo){
  const hoje = hojeISO();
  const visto = lerVistoAvisos();
  const doDia = avisosCache.filter(function(a){ return validadeAviso(a) === hoje; });
  const futuros = avisosCache.filter(function(a){ return validadeAviso(a) > hoje; })
    .sort(function(a, b){ return validadeAviso(a) < validadeAviso(b) ? -1 : 1; });
  const novo = function(a){ return msAviso(a.criado_em) > visto; };

  if(doDia.length === 0 && futuros.length === 0){
    document.body.classList.add('sem-avisos-pais');
    alvo.innerHTML = `
      <div class="avisos-vazio-pais">
        <div class="ginger-vazia" role="img" aria-label="Ginger, a raposa mascote do AGITA" onclick="gingerVazia(this)"><div class="g-img"></div></div>
        <h3>Tudo tranquilo por aqui!</h3>
        <p>Não há avisos para hoje. Quando o AGITA publicar um comunicado, ele aparece aqui e você recebe uma notificação.</p>
      </div>`;
    return;
  }
  document.body.classList.remove('sem-avisos-pais');
  alvo.innerHTML = `
    ${doDia.map(function(a){ return `
      <article class="mural-destaque" onclick="abrirAvisoAmpliado('${a.id}')">
        <div class="mural-destaque-topo">
          <span class="mural-etiqueta">Aviso de hoje</span>
          ${novo(a) ? '<span class="selo-novo">Novo</span>' : ''}
          <span class="mural-data">${formatarDataHora(a.criado_em)}</span>
        </div>

const cartoesAniv = {};
let gingerImgPromise = null;
function carregarGingerImg(){
  if(gingerImgPromise) return gingerImgPromise;
  gingerImgPromise = new Promise(function(res){
    try{
      const v = getComputedStyle(document.documentElement).getPropertyValue('--ginger').trim();
      const u = v.slice(v.indexOf('"')+1, v.lastIndexOf('"'));
      if(!u){ res(null); return; }
      const im = new Image();
      im.onload = function(){ res(im); };
      im.onerror = function(){ res(null); };
      im.src = u;
    }catch(e){ res(null); }
  });
  return gingerImgPromise;
}
function carregarImagem(src){
  return new Promise(function(res){
    if(!src){ res(null); return; }
    const im = new Image();
    im.onload = function(){ res(im); };
    im.onerror = function(){ res(null); };
    im.src = src;
  });
}
function aniversariantesDe(ref){

}
function tituloCartaoAniv(a){ return 'Feliz aniversário, ' + a.nome + '!'; }
function mesmoDiaLocal(iso){
  const d = new Date(iso), h = new Date();
  return d.getFullYear()===h.getFullYear() && d.getMonth()===h.getMonth() && d.getDate()===h.getDate();
}
function cartaoJaPublicado(a){

function quebrarTexto(ctx, txt, maxW){
  const palavras = txt.split(' ');
  const linhas = []; let atual = '';
  palavras.forEach(function(p){
    const t = atual ? atual+' '+p : p;
    if(ctx.measureText(t).width <= maxW || !atual){ atual = t; } else { linhas.push(atual); atual = p; }
  });
  if(atual) linhas.push(atual);
  return linhas;
}
function estrela(ctx, x, y, r, cor){
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = cor;
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const ang = i*Math.PI/4, rr = (i%2===0) ? r : r*0.28;
    ctx.lineTo(Math.cos(ang)*rr, Math.sin(ang)*rr);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
async function gerarCartaoAniversario(a){
  const W = 1200, H = 675;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  try{ await document.fonts.load("800 70px 'Baloo 2'"); await document.fonts.load("700 40px 'Nunito'"); }catch(e){}
  const ginger = await carregarGingerImg();
  const foto = await carregarImagem(a.foto);
  // gerador pseudo-aleatório estável por atleta
  let seed = 0; for(let i=0;i<a.id.length;i++) seed = (seed*31 + a.id.charCodeAt(i)) >>> 0;
  const rnd = function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; };

  // fundo
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#132A52'); g.addColorStop(0.5,'#1E4C8C'); g.addColorStop(1,'#F2892B');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalAlpha = 0.10; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(W*0.84, H*0.2, 230, 0, Math.PI*2); ctx.fill(); ctx.restore();

  // fitas de ginástica
  function fita(pts, cor, larg){
    ctx.save(); ctx.strokeStyle = cor; ctx.lineWidth = larg; ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
    ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
    ctx.bezierCurveTo(pts[2],pts[3],pts[4],pts[5],pts[6],pts[7]);
    ctx.bezierCurveTo(pts[8],pts[9],pts[10],pts[11],pts[12],pts[13]);
    ctx.stroke(); ctx.restore();
  }
  fita([-20,560, 120,420, 260,700, 380,520, 520,360, 640,640], '#FFC27A', 16);
  fita([-20,590, 130,460, 260,730, 390,560, 520,410, 650,680], '#F2892B', 7);
  fita([560,40, 700,150, 800,-30, 930,90, 1040,200, 1120,40], '#FF7BAC', 14);
  fita([560,62, 700,170, 800,-8, 930,112, 1040,222, 1120,62], '#FFD166', 6);

  // arcos (bambolês)
  function arco(x, y, r, c1, c2){
    const gg = ctx.createLinearGradient(x-r,y-r,x+r,y+r);
    gg.addColorStop(0,c1); gg.addColorStop(1,c2);
    ctx.save(); ctx.strokeStyle = gg; ctx.lineWidth = 16;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3; ctx.setLineDash([8,16]);
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke(); ctx.restore();
  }
  arco(1090, 560, 80, '#F2892B', '#FFC27A');
  arco(70, 70, 52, '#4CC9B0', '#FFD166');

  // bola
  const bx = 960, by = 600, br = 38;
  const bg = ctx.createRadialGradient(bx-12, by-14, 4, bx, by, br);
  bg.addColorStop(0,'#FFD9A8'); bg.addColorStop(1,'#E06A16');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fill();

  // confete
  const cores = ['#F2892B','#FFC27A','#FF7BAC','#FFD166','#4CC9B0','#ffffff','#3E6BB0'];
  for(let i=0;i<90;i++){
    const x = rnd()*W, y = rnd()*H, w = 8+rnd()*12, h = (rnd()<.5) ? w : w*2.2;
    ctx.save(); ctx.translate(x,y); ctx.rotate(rnd()*Math.PI);
    ctx.globalAlpha = 0.85; ctx.fillStyle = cores[i%cores.length];
    ctx.fillRect(-w/2,-h/2,w,h); ctx.restore();
  }
  for(let i=0;i<14;i++) estrela(ctx, rnd()*W, rnd()*H, 8+rnd()*12, 'rgba(255,255,255,.85)');

  // foto (ou inicial) em moldura redonda
  const cx = 205, cy = 345, r = 130;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx,cy,r+14,0,Math.PI*2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.strokeStyle = '#F2892B'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(cx,cy,r+22,0,Math.PI*2); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
  if(foto){
    const s = Math.max(2*r/foto.width, 2*r/foto.height);
    ctx.drawImage(foto, cx - foto.width*s/2, cy - foto.height*s/2, foto.width*s, foto.height*s);
  } else {
    const fg = ctx.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
    fg.addColorStop(0,'#FFC27A'); fg.addColorStop(1,'#F2892B');
    ctx.fillStyle = fg; ctx.fillRect(cx-r,cy-r,2*r,2*r);
    ctx.fillStyle = '#fff'; ctx.font = "800 150px 'Baloo 2', sans-serif"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText((a.nome||'?').trim().charAt(0).toUpperCase(), cx, cy+8);
  }
  ctx.restore();

  // textos
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = "800 30px 'Baloo 2', sans-serif";
  ctx.fillText('AGITA', 46, 60);
  const tx = 392;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
  ctx.fillStyle = '#FFD166'; ctx.font = "800 44px 'Baloo 2', sans-serif"; ctx.fillText('🎂 PARABÉNS!', tx, 215);
  ctx.fillStyle = '#fff'; ctx.font = "800 72px 'Baloo 2', sans-serif";
  ctx.fillText('FELIZ', tx, 292); ctx.fillText('ANIVERSÁRIO!', tx, 366);
  ctx.restore();
  // nome (ajusta e quebra em até 2 linhas)
  let tam = 46; let linhas = [];
  for(;;){
    ctx.font = "700 " + tam + "px 'Baloo 2', sans-serif";
    linhas = quebrarTexto(ctx, a.nome || '', 480);
    if((linhas.length <= 2 && Math.max.apply(null, linhas.map(function(l){ return ctx.measureText(l).width; })) <= 480) || tam <= 30) break;
    tam -= 3;
  }
  ctx.fillStyle = '#fff';
  linhas.slice(0,2).forEach(function(l, i){ ctx.fillText(l, tx, 424 + i*(tam+6)); });
  ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.font = "600 26px 'Nunito', sans-serif";
  ctx.fillText('Toda a família AGITA deseja muita alegria! 🎉', tx, 424 + Math.min(linhas.length,2)*(tam+6) + 28);

  // Ginger
  if(ginger){
    const gh = 500, gw = ginger.width*gh/ginger.height;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 8;
    ctx.drawImage(ginger, W - gw - 20, H - gh - 6, gw, gh); ctx.restore();
  }
  return cv.toDataURL('image/jpeg', 0.88);
}

function reuAcharItem(id){ return reuniao.dados.itens.find(function(i){return i.id===id;}); }
function reuPct(it){ const t = it.subitens.length; return t ? it.subitens.filter(function(x){return x.status==='decidido';}).length / t : 0; }
function reuTotais(){ let t=0, dec=0; reuniao.dados.itens.forEach(function(i){ i.subitens.forEach(function(x){ t++; if(x.status==='decidido') dec++; }); }); return {t:t, dec:dec}; }
function reuMaxR(s){
  const d = reuniao.dados, n = d.itens.length;
  if(s===0) return n;
  if(s<=n) return d.itens[s-1].subitens.length;
  if(s===n+1) return d.papeis.length;
  return 0;
}
function reuAjustarPos(){
  const n = reuniao.dados.itens.length;
  reuniaoLocal.s = Math.min(Math.max(0, reuniaoLocal.s), n+2);
  reuniaoLocal.r = Math.min(Math.max(0, reuniaoLocal.r), reuMaxR(reuniaoLocal.s));
}

/* ---------- Mascotes ---------- */
function reuGingerFala(txt, festa, quem){
  const ativos = reuAtivos();
  if(!quem || ativos.indexOf(quem) < 0) quem = ativos[Math.floor(Math.random()*ativos.length)];
  ['reu-ginger','reu-gloria'].forEach(function(id){ const o = document.getElementById(id); if(o){ o.classList.remove('fala'); } });
  const g = document.getElementById(quem==='gloria' ? 'reu-gloria' : 'reu-ginger');
  const b = g && g.querySelector('.reu-bal');
  if(!g || !b) return;
  b.textContent = txt; g.classList.add('fala');
  g.classList.remove('pulo'); void g.offsetWidth; g.classList.add('pulo');
  clearTimeout(reuniaoGTimer);
  reuniaoGTimer = setTimeout(function(){ g.classList.remove('fala'); g.classList.remove('pulo'); }, 4200);
  if(festa && window.confeteBurst){
    const r = g.getBoundingClientRect();
    window.confeteBurst(r.left + r.width/2, r.top + 40, 40, 'cima');
  }
}
function reuReacao(sAnt, rAnt){
  const p = reuniaoLocal, n = reuniao.dados.itens.length, ativos = reuAtivos();
  if(p.s !== sAnt){
    let f = reuniaoTipo==='diretoria' ? (REU_FRASES[p.s] || null) : (p.s===0 ? 'Bem-vindos, famílias do AGITA! 💛' : null);
    if(p.s === n+1) f = 'Cada um com seu papel: time campeão! 🏆';
    else if(p.s === n+2) f = 'Quanta coisa resolvida! 🏆';
    reuGingerFala(f || 'Vamos lá! 🦊', p.s === n+2, ativos[0]);
    if(p.s === 0 && ativos.length > 1){
      setTimeout(function(){ if(reuniaoLocal.s === 0) reuGingerFala('Será que a mascote sou eu? 🐔', false, 'gloria'); }, 2800);
    } else if(ativos.length > 1 && Math.random() < 0.5){
      setTimeout(function(){ if(reuniaoLocal.s === p.s) reuGingerFala(REU_REACOES_G[Math.floor(Math.random()*REU_REACOES_G.length)], false, 'gloria'); }, 2600);
    }
  } else if(p.r > rAnt){
    const quem = ativos[Math.floor(Math.random()*ativos.length)];
    const lista = quem==='gloria' ? REU_REACOES_G : REU_REACOES;
    reuGingerFala(lista[Math.floor(Math.random()*lista.length)], false, quem);
  }
}

/* ---------- Visuais ---------- */
function reuAnel(p){
  return '<div class="reu-anel"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="val" data-p="'+p+'" cx="60" cy="60" r="52" transform="rotate(-90 60 60)"/></svg><strong>'+Math.round(p*100)+'%</strong></div>';
}
function reuPlanta(p){
  const emoji = p>=1 ? '🌳' : p>=0.5 ? '🌿' : p>0 ? '🌱' : '🌰';
  return '<div class="reu-planta-caixa"><div class="reu-planta" data-tam="'+Math.round(34+p*58)+'">'+emoji+'</div></div>';
}
function reuBarras(modo){
  const its = reuniao.dados.itens;
  const max = Math.max(1, Math.max.apply(null, its.map(function(i){return i.subitens.length;})));
  return '<div class="reu-barras">' + its.map(function(it){
    const p = reuPct(it);
    const h = modo==='pct' ? Math.max(6, p*100) : (it.subitens.length/max*100);
    const f = modo==='pct' ? 100 : Math.round(p*100);
    return '<div class="reu-barra" title="'+reuEsc(it.titulo)+'"><div class="reu-coluna"><i data-h="'+h+'" data-f="'+f+'"><b></b></i></div><span>'+reuEsc(it.icone)+'</span><em>'+(modo==='pct' ? Math.round(p*100)+'%' : it.subitens.length)+'</em></div>';
  }).join('') + '</div>';
}
function reuAnimar(animado){
  const palco = document.getElementById('reu-palco');
  if(!palco) return;
  palco.classList.toggle('sem-trans', !animado);
  setTimeout(function(){
    palco.querySelectorAll('.reu-coluna i').forEach(function(i){ i.style.height = i.dataset.h+'%'; const b = i.firstElementChild; if(b) b.style.height = i.dataset.f+'%'; });
    palco.querySelectorAll('.reu-anel .val').forEach(function(c){ c.style.strokeDashoffset = (326.7*(1-parseFloat(c.dataset.p))).toFixed(1); });
    palco.querySelectorAll('.reu-planta').forEach(function(p){ p.style.fontSize = p.dataset.tam+'px'; });
    palco.querySelectorAll('[data-alvo]').forEach(function(el){
      const alvo = +el.dataset.alvo;
      if(!animado){ el.textContent = alvo; return; }
      const t0 = performance.now();
      (function passo(t){ const k = Math.min(1, (t-t0)/900); el.textContent = Math.round(alvo*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(passo); })(t0);
    });
  }, 60);
}

/* ---------- Slides ---------- */
function reuHtmlEnquete(){
  if(MASCOTE_VENCEDORA){
    const nome = MASCOTE_VENCEDORA==='gloria' ? 'Glória, a galinha' : 'Ginger, a raposa';
    return '<div class="reu-enquete vencedora">👑 <b>Nossa mascote oficial:</b> '+nome+'</div>';
  }
  return '<div class="reu-enquete"><div class="reu-enq-txt">🗳️ <b>Enquete da mascote</b><span>Quem será a mascote oficial do AGITA? O resultado sai amanhã!</span></div>'
    + '<div class="reu-vs"><div class="reu-vs-c"><i class="a"></i><em>Ginger</em></div><strong>VS</strong><div class="reu-vs-c"><i class="b"></i><em>Glória</em></div></div></div>';
}
function reuHtmlAbertura(r){
  const d = reuniao.dados, tot = reuTotais();
  const data = new Date().toLocaleDateString('pt-BR', {day:'numeric', month:'long', year:'numeric'});
  const lista = d.itens.map(function(it, k){
    return '<li class="'+(k<r ? 'vis'+(k===r-1 && reuniaoUltimo.novo ? ' novo' : '') : 'oculto')+'"><span>'+(k+1)+'</span>'+reuEsc(it.icone)+' '+reuEsc(it.titulo)+'</li>';
  }).join('');
  return '<div class="reu-abertura"><div class="reu-abre-txt"><small>'+data+'</small><h1>'+reuEsc(d.titulo)+'</h1>'
    + '<div class="reu-stats"><div><b data-alvo="'+d.itens.length+'">0</b><span>itens de pauta</span></div><div><b data-alvo="'+tot.t+'">0</b><span>tópicos</span></div><div><b data-alvo="'+tot.dec+'">0</b><span>decididos</span></div></div>'
    + '<ol class="reu-agenda">'+lista+'</ol></div>'
    + '<div class="reu-grafico"><h3>🌱 Crescimento da pauta</h3>'+reuBarras('qtd')+'<p>Cada barra é um item; a parte laranja são os tópicos já decididos.</p></div></div>'
    + reuHtmlEnquete();
}
function reuCartaoSub(it, x, k, r, ed){
  const visivel = k < r || (ed && reuniaoEdicao);
  if(!visivel) return '';
  const novo = (k === r-1 && reuniaoUltimo.novo);
  const st = REU_ST[x.status] || REU_ST.pendente;
  let h = '<div class="reu-sub st-'+x.status+(novo ? ' novo' : '')+(k>=r ? ' fraco' : '')+'" data-id="'+x.id+'">';
  h += '<div class="reu-sub-topo"><span class="reu-num">'+(k+1)+'</span>';
  if(ed && reuniaoEdicao) h += '<input class="reu-in reu-txt-in" value="'+reuEsc(x.texto)+'" oninput="reuCampo(\''+x.id+'\',\'texto\',this.value)">';
  else h += '<span class="reu-txt">'+reuEsc(x.texto)+'</span>';
  h += ed ? '<button type="button" class="reu-st" onclick="reuCiclar(\''+x.id+'\')">'+st[0]+' '+st[1]+'</button>' : '<span class="reu-st fixo">'+st[0]+' '+st[1]+'</span>';
  if(ed && reuniaoEdicao) h += '<button type="button" class="reu-x" title="Remover" onclick="reuDel(\''+x.id+'\')">×</button>';
  h += '</div>';
  if(ed){
    h += '<div class="reu-campos"><input class="reu-in" placeholder="👤 Responsável (vazio = toda a diretoria)" value="'+reuEsc(x.responsavel)+'" oninput="reuCampo(\''+x.id+'\',\'responsavel\',this.value)">'
      + '<input class="reu-in" placeholder="✍️ Decisão / encaminhamento" value="'+reuEsc(x.decisao)+'" oninput="reuCampo(\''+x.id+'\',\'decisao\',this.value)"></div>';
  } else if(x.responsavel || x.decisao || x.status==='decidido'){
    h += '<div class="reu-dec">'+((x.responsavel || x.status==='decidido') ? '<span>'+(x.responsavel ? '👤 '+reuEsc(x.responsavel) : '👥 Decidido por toda a diretoria')+'</span>' : '')+(x.decisao ? '<span>✍️ '+reuEsc(x.decisao)+'</span>' : '')+'</div>';
  }
  return h + '</div>';
}
function reuHtmlItem(s, r){
  const it = reuniao.dados.itens[s-1], n = reuniao.dados.itens.length, ed = reuniao.podeEditar;
  const p = reuPct(it);
  let h = '<div class="reu-item"><div class="reu-cab"><div class="reu-ico">'+reuEsc(it.icone)+'</div><div class="reu-cab-txt"><small>Item '+s+' de '+n+'</small>';
  if(ed && reuniaoEdicao) h += '<input class="reu-in reu-tit-in" value="'+reuEsc(it.titulo)+'" oninput="reuTitulo(\''+it.id+'\',this.value)">';
  else h += '<h2>'+reuEsc(it.titulo)+'</h2>';
  h += '</div>'+reuAnel(p)+reuPlanta(p)+'</div><div class="reu-subs">';
  it.subitens.forEach(function(x, k){ h += reuCartaoSub(it, x, k, r, ed); });
  if(ed && reuniaoEdicao) h += '<button type="button" class="reu-add" onclick="reuAdd(\''+it.id+'\')">+ Adicionar tópico</button>';
  if(r === 0 && !(ed && reuniaoEdicao)) h += '<div class="reu-dica">Pressione <kbd>Enter</kbd> para revelar o primeiro tópico ✨</div>';
  h += '</div>';
  h += reuHtmlNotas(it);
  if(ed) h += '<textarea class="reu-in reu-nota" placeholder="📝 Anotações do debate deste item…" oninput="reuNota(\''+it.id+'\',this.value)">'+reuEsc(it.nota)+'</textarea>';
  else if(it.nota) h += '<div class="reu-nota-ler">📝 '+reuEsc(it.nota)+'</div>';
  return h + '</div>';
}
function reuHtmlNotas(it){
  const notas = (reuniao.notas || []).filter(function(n){ return n.item_id === it.id; });
  if(!notas.length && !reuniao.podeAnotar) return '';
  let h = '<div class="reu-notas"><h4>📝 Anotações da equipe</h4>';
  notas.forEach(function(n){
    h += '<div class="reu-nota-item"><b>'+reuEsc(n.autor)+'</b><span>'+reuEsc(n.texto)+'</span>'+(n.pode_apagar ? '<button type="button" class="reu-x" title="Apagar" onclick="reuApagarNotaEquipe(\''+n.id+'\')">×</button>' : '')+'</div>';
  });
  if(reuniao.podeAnotar){
    h += '<textarea id="reu-nota-nova" class="reu-in" placeholder="Escreva uma anotação sobre este item…" oninput="reuNotaNovaInput(this.value)"></textarea>'
      + '<button type="button" class="reu-btn primario" onclick="reuSalvarNotaEquipe(\''+it.id+'\')">Salvar anotação</button>';
  }
  return h + '</div>';
}
function reuNotasResumo(){
  const notas = reuniao.notas || [];
  if(!notas.length) return '';
  const nomes = {};
  reuniao.dados.itens.forEach(function(i){ nomes[i.id] = i.titulo; });
  return '<h3>📝 Anotações</h3><ul>'+notas.map(function(n){ return '<li><b>'+reuEsc(nomes[n.item_id] || 'Geral')+' · '+reuEsc(n.autor)+'</b><span>'+reuEsc(n.texto)+'</span></li>'; }).join('')+'</ul>';
}
function reuNotaNovaInput(v){ reuRascunho = v; }
async function reuForcarPoll(){ if(reuniao){ reuniao.versao = -1; await reuPoll(); } }
async function reuSalvarNotaEquipe(itemId){
  const txt = (reuRascunho || '').trim();
  if(!txt){ mostrarToast('Escreva a anotação antes de salvar.'); return; }
  try{
    const resp = await fetch('/api/reuniao/nota?'+reuQ(), {method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body:JSON.stringify({itemId:itemId, texto:txt})});
    const j = await resp.json();
    if(!resp.ok){ mostrarToast((j && j.erro) || 'Não foi possível salvar.'); return; }
    reuRascunho = '';
    await reuForcarPoll();
    reuGingerFala('Anotado! ✍️', false);
  }catch(e){ mostrarToast('Sem conexão: anotação não salva.'); }
}
async function reuApagarNotaEquipe(id){
  try{
    const resp = await fetch('/api/reuniao/nota?'+reuQ()+'&id='+encodeURIComponent(id), {method:'DELETE', credentials:'include'});
    if(!resp.ok){ const j = await resp.json().catch(function(){return null;}); mostrarToast((j && j.erro) || 'Não foi possível apagar.'); return; }
    await reuForcarPoll();
  }catch(e){ mostrarToast('Sem conexão.'); }
}

function reuHtmlPapeis(r){
  const d = reuniao.dados, ed = reuniao.podeEditar;
  let h = '<div class="reu-papeis"><div class="reu-cab"><div class="reu-ico">🎽</div><div class="reu-cab-txt"><small>Organização</small><h2>'+(reuniaoTipo==='pais' ? 'Nossa equipe' : 'Papéis da diretoria')+'</h2></div></div><div class="reu-cartoes">';
  d.papeis.forEach(function(pp, k){
    if(!(k < r || (ed && reuniaoEdicao))) return;
    const novo = (k === r-1 && reuniaoUltimo.novo);
    const ini = (pp.nome || '?').trim().charAt(0).toUpperCase();
    h += '<div class="reu-papel'+(novo ? ' novo' : '')+'"><div class="reu-av">'+reuEsc(ini)+'</div><div class="reu-papel-txt">';
    if(ed){
      h += '<input class="reu-in" placeholder="Nome" value="'+reuEsc(pp.nome)+'" oninput="reuPapel(\''+pp.id+'\',\'nome\',this.value)">'
        + '<input class="reu-in" placeholder="Papel / responsabilidade" value="'+reuEsc(pp.papel)+'" oninput="reuPapel(\''+pp.id+'\',\'papel\',this.value)">'
        + '<button type="button" class="reu-x" title="Remover" onclick="reuDelPapel(\''+pp.id+'\')">×</button>';
    } else {
      h += '<b>'+reuEsc(pp.nome || '—')+'</b><span>'+reuEsc(pp.papel || 'a definir')+'</span>';
    }
    h += '</div></div>';
  });
  h += '</div>';
  if(!d.papeis.length) h += '<div class="reu-dica">'+(ed ? 'Adicione cada diretor e defina o papel — tudo atualiza na hora para todos.' : 'Os papéis serão definidos durante a reunião 🦊')+'</div>';
  else if(r === 0 && !ed) h += '<div class="reu-dica">Pressione <kbd>Enter</kbd> para revelar ✨</div>';
  if(ed) h += '<button type="button" class="reu-add" onclick="reuAddPapel()">+ Adicionar '+(reuniaoTipo==='pais' ? 'pessoa' : 'diretor')+'</button>';
  return h + '</div>';
}
function reuHtmlResumo(){
  const d = reuniao.dados, tot = reuTotais();
  const pct = tot.t ? tot.dec/tot.t : 0;
  let dec = '';
  d.itens.forEach(function(it){
    it.subitens.forEach(function(x){
      if(x.status==='decidido') dec += '<li><b>'+reuEsc(it.icone)+' '+reuEsc(it.titulo)+' › '+reuEsc(x.texto)+'</b><span>'+(x.responsavel ? '👤 '+reuEsc(x.responsavel) : '👥 Decidido por toda a diretoria')+'</span>'+(x.decisao ? '<span>✍️ '+reuEsc(x.decisao)+'</span>' : '')+'</li>';
    });
  });
  const pap = d.papeis.filter(function(p){return p.nome;}).map(function(p){ return '<li><b>'+reuEsc(p.nome)+'</b><span>'+reuEsc(p.papel || 'a definir')+'</span></li>'; }).join('');
  return '<div class="reu-resumo"><div class="reu-cab"><div class="reu-ico">🏆</div><div class="reu-cab-txt"><small>Encerramento</small><h2>Resumo da reunião</h2></div>'+reuAnel(pct)+reuPlanta(pct)+'</div>'
    + '<div class="reu-resumo-grade"><div class="reu-grafico"><h3>📈 Decisões por item</h3>'+reuBarras('pct')+'</div>'
    + '<div class="reu-lista"><h3>✅ Decisões ('+tot.dec+' de '+tot.t+')</h3><ul>'+(dec || '<li><span>Nenhuma decisão registrada ainda.</span></li>')+'</ul>'
    + (pap ? '<h3>🎽 Papéis</h3><ul>'+pap+'</ul>' : '') + reuNotasResumo() + '</div></div></div>';
}

/* ---------- Desenho principal ---------- */
function desenharReuniao(){
  if(!reuniao || !document.getElementById('reu-palco')) return;
  reuAjustarPos();
  const d = reuniao.dados, n = d.itens.length, s = reuniaoLocal.s, r = reuniaoLocal.r, ed = reuniao.podeEditar;
  const total = n + 3;
  const mudouSlide = reuniaoUltimo.s !== s;
  reuniaoUltimo.novo = (!mudouSlide && r > reuniaoUltimo.r);
  let corpo;
  if(s === 0) corpo = reuHtmlAbertura(r);
  else if(s <= n) corpo = reuHtmlItem(s, r);
  else if(s === n+1) corpo = reuHtmlPapeis(r);
  else corpo = reuHtmlResumo();
  let topo = '<div class="reu-topo"><div class="reu-ttl">📋 '+reuEsc(d.titulo)+' <small>'+(s+1)+' / '+total+'</small></div><div class="reu-ctl">';
  if(ed) topo += '<span class="reu-chip vivo">🎤 Você está apresentando</span><button type="button" class="reu-btn'+(reuniaoEdicao ? ' on' : '')+'" onclick="reuEdicaoAlt()">✏️ Edição</button>';
  else if(reuniaoSeguindo) topo += '<span class="reu-chip vivo">🔴 Ao vivo · seguindo a apresentação</span>';
  else topo += '<button type="button" class="reu-btn on" onclick="reuSeguir()">↪ Voltar a seguir a apresentação</button>';
  topo += '<button type="button" class="reu-btn" onclick="reuTelaCheia()">⛶ Tela cheia</button></div></div><div class="reu-pontos">';
  for(let i=0;i<total;i++) topo += '<button type="button" class="'+(i===s ? 'at' : i<s ? 'ok' : '')+'" onclick="reuIr('+i+')" title="'+(i===0 ? 'Abertura' : i<=n ? reuEsc(d.itens[i-1].titulo) : i===n+1 ? 'Papéis' : 'Resumo')+'"></button>';
  topo += '</div>';
  document.getElementById('reu-topo').innerHTML = topo;
  const palco = document.getElementById('reu-palco');
  if(mudouSlide) reuRascunho = '';
  const ta0 = document.getElementById('reu-nota-nova');
  const tinhaFoco = !!ta0 && document.activeElement === ta0;
  const pos0 = tinhaFoco ? ta0.selectionStart : 0;
  palco.innerHTML = '<div class="reu-slide'+(mudouSlide ? ' entrar' : '')+'">'+corpo+'</div>';
  const ta1 = document.getElementById('reu-nota-nova');
  if(ta1){ ta1.value = reuRascunho; if(tinhaFoco){ ta1.focus(); try{ ta1.setSelectionRange(pos0, pos0); }catch(e){} } }
  document.getElementById('reu-nav').innerHTML =
    '<button type="button" class="reu-btn" onclick="reuVoltar()">◀ Voltar</button><span class="reu-hint"><kbd>Enter</kbd> avança · <kbd>←</kbd> volta · <kbd>F</kbd> tela cheia</span><button type="button" class="reu-btn primario" onclick="reuAvancar()">Avançar ▶</button>';
  reuAnimar(mudouSlide);
  reuniaoUltimo.s = s; reuniaoUltimo.r = r;
}

/* ---------- Navegação ---------- */
function reuMover(s, r, silencioso){
  if(!reuniao) return;
  const sAnt = reuniaoLocal.s, rAnt = reuniaoLocal.r;
  if(!reuniao.podeEditar && reuniaoSeguindo) reuniaoSeguindo = false;
  reuniaoLocal = {s:s, r:r};
  reuAjustarPos();
  desenharReuniao();
  if(!silencioso) reuReacao(sAnt, rAnt);
  if(reuniao.podeEditar){
    clearTimeout(reuniaoPosT);
    reuniaoPosT = setTimeout(reuEnviarPos, 120);
  }
}
async function reuEnviarPos(){
  if(reuniaoPosEnviando){ reuniaoPosT = setTimeout(reuEnviarPos, 150); return; }
  reuniaoPosEnviando = true;
  try{
    const resp = await fetch('/api/reuniao/posicao?'+reuQ(), {method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body:JSON.stringify({posicao:reuniaoLocal})});
    const j = await resp.json();
    if(j && j.versao && reuniao) reuniao.versao = Math.max(reuniao.versao, j.versao);
  }catch(e){}
  reuniaoPosEnviando = false;
}
function reuAvancar(){
  if(!reuniao) return;
  const p = reuniaoLocal, n = reuniao.dados.itens.length;
  if(p.r < reuMaxR(p.s)) reuMover(p.s, p.r+1);
  else if(p.s < n+2) reuMover(p.s+1, 0);
  else reuGingerFala('Fim da pauta! Parabéns, diretoria! 🎉', true);
}
function reuVoltar(){
  if(!reuniao) return;
  const p = reuniaoLocal;
  if(p.r > 0) reuMover(p.s, p.r-1, true);
  else if(p.s > 0) reuMover(p.s-1, reuMaxR(p.s-1), true);
}
function reuIr(s){ reuMover(s, 0); }
function reuSeguir(){
  reuniaoSeguindo = true;

/* ---------- Edição (admin) ---------- */
function reuSalvarAgora(){
  clearTimeout(reuniaoSalvarT);
  reuniaoSalvarT = setTimeout(async function(){
    reuniaoPendente = false;
    try{
      const resp = await fetch('/api/reuniao?'+reuQ(), {method:'PUT', credentials:'include', headers:{'Content-Type':'application/json'}, body:JSON.stringify({dados:reuniao.dados})});
      const j = await resp.json();
      if(j && j.versao) reuniao.versao = Math.max(reuniao.versao, j.versao);
      if(!resp.ok) mostrarToast((j && j.erro) || 'Não foi possível salvar.');
      else { const el = document.getElementById('reu-salvo'); if(el){ el.classList.add('ver'); setTimeout(function(){ el.classList.remove('ver'); }, 1200); } }
    }catch(e){ mostrarToast('Sem conexão: alteração não salva.'); }
  }, 450);
  reuniaoPendente = true;
}
function reuCampo(id, campo, valor){ const x = reuAchar(id); if(x){ x[campo] = valor; reuSalvarAgora(); } }
function reuTitulo(id, v){ const it = reuAcharItem(id); if(it){ it.titulo = v; reuSalvarAgora(); } }
function reuNota(id, v){ const it = reuAcharItem(id); if(it){ it.nota = v; reuSalvarAgora(); } }
function reuCiclar(id){
  const x = reuAchar(id); if(!x) return;
  const ordem = ['pendente','debate','decidido'];
  x.status = ordem[(ordem.indexOf(x.status)+1) % 3];
  reuSalvarAgora(); desenharReuniao();
  if(x.status === 'decidido') reuGingerFala('Decidido! 🎉', true);
  else if(x.status === 'debate') reuGingerFala('Em debate… 💬', false);
}
function reuAdd(idItem){
  const it = reuAcharItem(idItem); if(!it) return;
  it.subitens.push({id: it.id+'s'+Date.now().toString(36), texto:'Novo tópico', status:'pendente', responsavel:'', decisao:''});
  reuSalvarAgora();
  if(reuniaoLocal.r < it.subitens.length && !reuniaoEdicao) reuMover(reuniaoLocal.s, it.subitens.length, true); else desenharReuniao();
}
function reuDel(id){
  for(const it of reuniao.dados.itens){
    const k = it.subitens.findIndex(function(s){return s.id===id;});
    if(k >= 0){ it.subitens.splice(k,1); break; }
  }
  reuSalvarAgora(); desenharReuniao();
}
function reuPapel(id, campo, v){ const p = reuniao.dados.papeis.find(function(x){return x.id===id;}); if(p){ p[campo] = v; reuSalvarAgora(); } }
function reuAddPapel(){
  reuniao.dados.papeis.push({id:'p'+Date.now().toString(36), nome:'', papel:''});
  reuSalvarAgora();
  reuMover(reuniaoLocal.s, reuniao.dados.papeis.length, true);
}
function reuDelPapel(id){
  const k = reuniao.dados.papeis.findIndex(function(x){return x.id===id;});
  if(k >= 0) reuniao.dados.papeis.splice(k,1);
  reuSalvarAgora(); desenharReuniao();
}

/* ---------- Sincronização (polling) ---------- */
async function reuPoll(){
  if(!emReuniao()){ clearInterval(reuniaoTimer); reuniaoTimer = null; return; }
  if(reuniaoPollando || !reuniao) return;
  reuniaoPollando = true;
  try{
    const resp = await fetch('/api/reuniao?'+reuQ()+'&v='+reuniao.versao, {credentials:'include'});
    if(!resp.ok) return;
    const j = await resp.json();
    if(j.semMudanca) return;
    if(reuniao.podeEditar){
      const mudouNotas = JSON.stringify(reuniao.notas || []) !== JSON.stringify(j.notas || []);
      const el0 = document.activeElement;
      if(mudouNotas && el0 && /^(INPUT|TEXTAREA|SELECT)$/.test(el0.tagName)) return;
      reuniao.notas = j.notas;
      reuniao.versao = Math.max(reuniao.versao, j.versao);
      if(mudouNotas) desenharReuniao();
      return;
    }
    const antes = {};
    reuniao.dados.itens.forEach(function(i){ i.subitens.forEach(function(x){ antes[x.id] = x.status; }); });
    let decidiuNovo = false;
    j.dados.itens.forEach(function(i){ i.subitens.forEach(function(x){ if(x.status==='decidido' && antes[x.id] && antes[x.id] !== 'decidido') decidiuNovo = true; }); });
    reuniao = j;
    if(reuniaoSeguindo){
      const sAnt = reuniaoLocal.s, rAnt = reuniaoLocal.r;
      reuniaoLocal = {s:j.posicao.s, r:j.posicao.r};
      desenharReuniao();
      reuReacao(sAnt, rAnt);
    } else {
      desenharReuniao();
    }
    if(decidiuNovo) reuGingerFala('Decidido! 🎉', true);
  }catch(e){} finally { reuniaoPollando = false; }
}
async function renderReuniao(tipo){
  reuniaoTipo = (tipo === 'pais') ? 'pais' : 'diretoria';
  const c = document.getElementById('conteudo');
  if(!(reuniaoTipo==='pais' ? podeVerReuniaoPais() : podeVerReuniao())){ irPara('inicio'); return; }
  clearInterval(reuniaoTimer); reuniaoTimer = null;
  const at = reuAtivos();
  c.innerHTML = '<div id="reu-raiz" class="reu"><div id="reu-topo"></div><div id="reu-palco"><div class="reu-carregando">Carregando a pauta…</div></div><div id="reu-nav" class="reu-nav"></div>'
    + '<span id="reu-salvo" class="reu-salvo">💾 salvo</span><div class="reu-mascotes">'
    + (at.indexOf('gloria') >= 0 ? '<div id="reu-gloria" class="reu-gloria"><div class="reu-bal"></div><div class="reu-foto"></div><em>Glória</em></div>' : '')
    + (at.indexOf('ginger') >= 0 ? '<div id="reu-ginger" class="reu-ginger"><div class="reu-bal"></div><div class="g-img"></div></div>' : '')
    + '</div></div>';
  try{
    const j = await api('reuniao?'+reuQ());
    reuniao = j;
    reuniaoEdicao = false; reuniaoSeguindo = true;
    reuniaoUltimo = {s:-1, r:0};
    reuniaoLocal = {s:j.posicao.s, r:j.posicao.r};
    desenharReuniao();
    setTimeout(function(){ reuGingerFala(reuniao.podeEditar ? 'Pronta quando você estiver! Enter para começar 🦊' : 'Acompanhe a apresentação ao vivo! 🦊', false, at[0]); }, 700);
    if(at.length > 1) setTimeout(function(){ reuGingerFala('Cocoricó! Cheguei! 🐔', false, 'gloria'); }, 3300);
    reuniaoTimer = setInterval(reuPoll, 2500);
  }catch(e){
    const p = document.getElementById('reu-palco');
    if(p) p.innerHTML = '<div class="reu-carregando">Não foi possível carregar a pauta.</div>';
  }
}
function renderReuniaoPais(){ return renderReuniao('pais'); }
if(!window.__reuTeclas){
  window.__reuTeclas = true;
  document.addEventListener('keydown', function(e){
    if(!emReuniao() || !reuniao) return;
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    const el = document.activeElement;
    if(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    if(el && el.tagName === 'BUTTON') el.blur();
    const k = e.key;
    if(k==='Enter' || k==='ArrowRight' || k===' ' || k==='PageDown'){ e.preventDefault(); reuAvancar(); }
    else if(k==='ArrowLeft' || k==='Backspace' || k==='PageUp'){ e.preventDefault(); reuVoltar(); }
    else if(k==='Home'){ e.preventDefault(); reuMover(0,0,true); }
    else if(k==='End'){ e.preventDefault(); reuMover(reuniao.dados.itens.length+2,0); }
    else if(k==='f' || k==='F'){ reuTelaCheia(); }
  });
}

/* ================================================================
   ATUALIZAÇÃO AUTOMÁTICA: confere se há versão nova do site ao abrir,
   ao voltar para o app e a cada 10 minutos; se houver, recarrega.
   ================================================================ */
let assinaturaSite = null, verificandoSite = false;
function assinar(txt){ let h = 5381; for(let i=0;i<txt.length;i++){ h = ((h<<5)+h + txt.charCodeAt(i)) | 0; } return txt.length+':'+h; }
async function lerAssinaturaSite(){
  const r = await fetch('/?chk='+Math.floor(Date.now()/1000), {cache:'no-cache'});
  if(!r.ok) throw new Error('falhou');
  return assinar(await r.text());
}
function usuarioOcupado(){
  const el = document.activeElement;
  if(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return true;
  const m = document.getElementById('modal-fundo');
  if(m && m.style.display === 'flex') return true;
  return emReuniao();
}
function mostrarAvisoAtualizacao(){
  if(document.getElementById('aviso-atualizacao')) return;
  const d = document.createElement('div');
  d.id = 'aviso-atualizacao';
  d.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99999;background:#132A52;color:#fff;border-radius:99px;padding:10px 12px 10px 18px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:12px;align-items:center;font:700 .95rem Nunito,sans-serif';
  d.innerHTML = '<span>✨ Nova versão do AGITA disponível</span><button type="button" style="border:0;border-radius:99px;background:#F2892B;color:#fff;padding:8px 16px;font:800 .9rem Nunito,sans-serif;cursor:pointer">Atualizar</button>';
  d.querySelector('button').onclick = function(){ location.reload(); };
  document.body.appendChild(d);
}
async function verificarAtualizacaoSite(){
  if(verificandoSite) return;
  verificandoSite = true;
  try{
    const atual = await lerAssinaturaSite();
    if(assinaturaSite === null){ assinaturaSite = atual; }
    else if(atual !== assinaturaSite){
      if(usuarioOcupado()) mostrarAvisoAtualizacao();
      else location.reload();
    }
  }catch(e){} finally { verificandoSite = false; }
}
if(!window.__atualizacaoAuto){
  window.__atualizacaoAuto = true;
  window.addEventListener('load', function(){ setTimeout(verificarAtualizacaoSite, 1500); });
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') verificarAtualizacaoSite(); });
  window.addEventListener('focus', verificarAtualizacaoSite);
  window.addEventListener('online', verificarAtualizacaoSite);
  setInterval(verificarAtualizacaoSite, 10*60*1000);
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.update().catch(function(){}); }); }).catch(function(){});
  }
}

function irPara(secao){
  secaoAtual = secao;
  document.querySelectorAll('#menu-desktop button, #menu-mobile button').forEach(b=>{
    b.classList.toggle('ativo', b.dataset.secao===secao);
  });
  document.querySelectorAll('#menu-desktop .menu-grupo').forEach(function(g){ g.querySelector('.menu-grupo-btn').classList.toggle('ativo', !!g.querySelector('.menu-sub button.ativo')); });
  const renderizadores = {
    inicio: renderInicio,
    atletas: renderAtletas,
    chamada: renderChamada,
    documentos: renderDocumentos,
    pagamentos: renderPagamentos,
    calendario: renderCalendario,
    avisos: renderAvisos,

    reuniao: renderReuniao,
    'reuniao-pais': renderReuniaoPais,

  (renderizadores[secao] || renderInicio)();

}

function filtrarPorSetor(chave){
  filtroSetorAtletas = chave;
  renderResumoSetoresAtletas();
  renderTabelaAtletas();
}
function renderResumoSetoresAtletas(){
  const setores = [
    { chave:'ESCOLINHA', rotulo:'Escolinha' },
    { chave:'PRE-EQUIPE', rotulo:'Pré-equipe' },
    { chave:'ALTO RENDIMENTO', rotulo:'Alto rendimento' }
  ];
  const alvo = document.getElementById('resumo-setores');
  if(!alvo) return;
  const semSetorQtd = atletasCache.filter(a=>!setores.some(s=>s.chave===a.setor)).length;
  const cartao = (chave, numero, rotulo) => `
    <div class="cartao-atalho ${filtroSetorAtletas===chave?'selecionado-filtro':''}" onclick="filtrarPorSetor('${chave}')">
      <div class="numero">${numero}</div>
      <div class="rotulo">${rotulo}</div>
    </div>`;
  alvo.innerHTML = `
    ${cartao('todos', atletasCache.length, 'Total de atletas')}
    ${setores.map(s=>cartao(s.chave, atletasCache.filter(a=>a.setor===s.chave).length, s.rotulo)).join('')}
    ${semSetorQtd>0 ? cartao('sem-setor', semSetorQtd, 'Sem setor definido') : ''}
  `;
}
function renderTabelaAtletas(){
  const busca = (document.getElementById('busca-atleta')?.value || '').toLowerCase();
  let lista = atletasCache.filter(a=>a.nome.toLowerCase().includes(busca));
  const setores = ['ESCOLINHA','PRE-EQUIPE','ALTO RENDIMENTO'];
  if(filtroSetorAtletas==='sem-setor') lista = lista.filter(a=>!setores.includes(a.setor));
  else if(filtroSetorAtletas!=='todos') lista = lista.filter(a=>a.setor===filtroSetorAtletas);
  const alvo = document.getElementById('tabela-atletas');
  if(lista.length===0){
    alvo.innerHTML = `<div class="vazio">Nenhuma atleta cadastrada ainda. Clique em "Nova atleta" para começar.</div>`;
    return;

        ${lista.map(a=>`
          <tr>
            <td>${a.foto ? `<img class="avatar-mini" src="${a.foto}">` : `<span class="avatar-mini"></span>`}</td>
            <td>${a.nome}</td>
            <td>${formatarData(a.nascimento)}</td>
            <td>${a.categoria||'—'}</td>
            <td>${formatarSetor(a.setor)}</td>
            <td>${a.responsavel||'—'}</td>
            <td>${a.telefone||'—'}</td>
            <td style="white-space:nowrap;">
              ${podeGerenciar() ? `
              <button class="btn btn-sm btn-secundario" onclick="abrirFormAtleta('${a.id}')">Editar</button>
              <button class="btn btn-sm btn-perigo" onclick="excluirAtleta('${a.id}')">Excluir</button>
              ` : '—'}
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
  `;
  adicionarFiltrosColunas(alvo, 'atletas');
}

function lerFotoAtleta(ev){
  const arq = ev.target.files[0];
  if(!arq) return;
  if(arq.size > 2*1024*1024){ mostrarToast('Foto muito grande (máx. ~2MB).'); ev.target.value=''; return; }
  const leitor = new FileReader();
  leitor.onload = e => fotoAtletaTemp = e.target.result;
  leitor.readAsDataURL(arq);
}
async function salvarAtleta(id){
  const nome = document.getElementById('af-nome').value.trim();
  if(!nome){ mostrarToast('Informe o nome da atleta.'); return; }
  const corpo = {
    nome,
    nascimento: document.getElementById('af-nascimento').value,
    categoria: document.getElementById('af-categoria').value.trim(),
    setor: document.getElementById('af-setor').value.trim(),
    responsavel: document.getElementById('af-responsavel').value.trim(),
    telefone: document.getElementById('af-telefone').value.trim(),
    foto: fotoAtletaTemp
  };
  try{
    if(id) await api('atletas/'+id, {method:'PUT', corpo});
    else await api('atletas', {method:'POST', corpo});
  }catch(e){ return; }
  fecharModal();
  await renderAtletas();
  mostrarToast('Atleta salva com sucesso.');
}
async function excluirAtleta(id){
  if(!confirm('Excluir esta atleta? Isso também remove documentos e pagamentos vinculados a ela.')) return;
  try{ await api('atletas/'+id, {method:'DELETE'}); }catch(e){ return; }
  await renderAtletas();

let arquivoDocTemp = null;
async function renderDocumentos(){
  if(!ehEquipe()){ irPara('inicio'); return; }
  const c = document.getElementById('conteudo');
  c.innerHTML = `<div class="cartao">Carregando...</div>`;

  c.innerHTML = `
    <div class="cabecalho-secao">

    </div>
    <div class="cartao">
      <div class="linha-form">
        <div class="campo">
          <label>Atleta</label>
          <select id="doc-atleta" onchange="renderListaDocs()">
            <option value="">Selecione...</option>
            ${atletasCache.map(a=>`<option value="${a.id}">${a.nome}</option>`).join('')}
          </select>
        </div>
        ${podeGerenciar() ? `
        <div class="campo">
          <label>Tipo de documento</label>
          <input type="text" id="doc-tipo" placeholder="Ex: Atestado médico">
        </div>
        <div class="campo">
          <label>Arquivo</label>
          <input type="file" id="doc-arquivo" onchange="lerArquivoDoc(event)">
        </div>` : ''}
      </div>
      ${podeGerenciar() ? `<div class="barra-acoes"><button class="btn btn-primario" onclick="salvarDocumento()">Adicionar documento</button></div>` : ''}
    </div>
    <div class="cartao"><div id="lista-docs"><div class="vazio">Selecione uma atleta acima para ver os documentos dela.</div></div></div>
  `;
}
function lerArquivoDoc(ev){
  const arq = ev.target.files[0];
  if(!arq) return;
  if(arq.size > 4*1024*1024){ mostrarToast('Arquivo muito grande para este protótipo (máx. ~4MB).'); ev.target.value=''; return; }
  const leitor = new FileReader();
  leitor.onload = e => arquivoDocTemp = {nomeArquivo: arq.name, conteudo: e.target.result};
  leitor.readAsDataURL(arq);
}
async function salvarDocumento(){
  const atletaId = document.getElementById('doc-atleta').value;
  const tipo = document.getElementById('doc-tipo').value.trim();
  if(!atletaId){ mostrarToast('Selecione a atleta.'); return; }
  if(!arquivoDocTemp){ mostrarToast('Escolha um arquivo.'); return; }
  try{
    await api('documentos', {method:'POST', corpo:{atletaId, tipo: tipo||'Documento', nomeArquivo: arquivoDocTemp.nomeArquivo, conteudo: arquivoDocTemp.conteudo}});
  }catch(e){ return; }
  document.getElementById('doc-tipo').value='';
  document.getElementById('doc-arquivo').value='';
  arquivoDocTemp = null;
  renderListaDocs();
  mostrarToast('Documento adicionado.');
}
async function renderListaDocs(){
  const atletaId = document.getElementById('doc-atleta').value;
  const alvo = document.getElementById('lista-docs');
  if(!atletaId){ alvo.innerHTML = `<div class="vazio">Selecione uma atleta acima para ver os documentos dela.</div>`; return; }
  alvo.innerHTML = 'Carregando...';
  let docs = [];
  try{
    const dados = await api('documentos?atletaId=' + encodeURIComponent(atletaId));
    docs = dados.documentos;
  }catch(e){ docs = []; }
  if(docs.length===0){ alvo.innerHTML = `<div class="vazio">Nenhum documento para esta atleta ainda.</div>`; return; }
  alvo.innerHTML = `
    <div class="tabela-wrap"><table>
      <thead><tr><th>Tipo</th><th>Arquivo</th><th>Enviado em</th><th></th></tr></thead>
      <tbody>
        ${docs.map(d=>`
          <tr>
            <td>${d.tipo}</td>
            <td>${d.nome_arquivo}</td>
            <td>${formatarData(d.data_upload ? d.data_upload.slice(0,10) : '')}</td>
            <td style="white-space:nowrap;">
              <a class="btn btn-sm btn-secundario" href="${d.conteudo}" download="${d.nome_arquivo}">Baixar</a>
              ${podeGerenciar() ? `<button class="btn btn-sm btn-perigo" onclick="excluirDocumento('${d.id}')">Excluir</button>` : ''}
            </td>
          </tr>`).join('')}
      </tbody>
    </table></div>
  `;
}
async function excluirDocumento(id){
  try{ await api('documentos/'+id, {method:'DELETE'}); }catch(e){ return; }
  renderListaDocs();
}

   ================================================================ */
let calMesAtual = new Date().getMonth();
let calAnoAtual = new Date().getFullYear();
const NOMES_MES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
async function renderCalendario(){
  const ehAdmin = podeGerenciar();
  const c = document.getElementById('conteudo');
  c.innerHTML = `
    <div class="cabecalho-secao">
      <div><h2>Calendário de eventos</h2><p>Treinos especiais, competições, reuniões e feriados do clube.</p></div>
      ${ehAdmin ? `<button class="btn btn-primario" onclick="abrirFormEvento()">+ Novo evento</button>` : ''}
    </div>
    <div class="cartao">
      <div class="cal-cabecalho">
        <button class="btn btn-sm btn-secundario" onclick="mudarMesCal(-1)">‹ Anterior</button>
        <h3 id="cal-titulo"></h3>
        <button class="btn btn-sm btn-secundario" onclick="mudarMesCal(1)">Próximo ›</button>
      </div>
      <div class="grade-cal-wrap"><div class="grade-cal" id="grade-calendario"></div></div>
    </div>
    <div class="cartao">
      <h3 style="margin-top:0;color:var(--azul-escuro);">Próximos eventos</h3>
      <div id="lista-proximos-eventos"></div>
    </div>
  `;
  await carregarEventos();
}
async function carregarEventos(){
  try{
    const dados = await api('eventos');
    eventosCache = dados.eventos;
  }catch(e){ eventosCache = []; }
  desenharCalendario();
  try{ const av = await api('avisos'); avisosCache = av.avisos || []; desenharCalendario(); }catch(e){}
}
function mudarMesCal(delta){
  calMesAtual += delta;
  if(calMesAtual<0){calMesAtual=11;calAnoAtual--;}
  if(calMesAtual>11){calMesAtual=0;calAnoAtual++;}
  desenharCalendario();
}
function desenharCalendario(){
  const ehAdmin = podeGerenciar();
  document.getElementById('cal-titulo').textContent = NOMES_MES[calMesAtual] + ' ' + calAnoAtual;
  const grade = document.getElementById('grade-calendario');
  const primeiroDia = new Date(calAnoAtual, calMesAtual, 1);
  const diasNoMes = new Date(calAnoAtual, calMesAtual+1, 0).getDate();
  const offset = primeiroDia.getDay();
  const hojeStr = new Date().toDateString();

  let html = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<offset;i++) html += `<div class="cal-dia fora"></div>`;
  for(let dia=1; dia<=diasNoMes; dia++){
    const dataObj = new Date(calAnoAtual, calMesAtual, dia);
    const dataISO = dataParaISOLocal(dataObj);
    const eventosDia = eventosCache.filter(e=> dataISO >= e.inicio && dataISO <= e.fim);
    const ehHoje = dataObj.toDateString()===hojeStr;
    html += `<div class="cal-dia ${ehHoje?'hoje':''}">
      <strong>${dia}</strong>
      <ul class="lista-eventos-dia">${calAvisosDoDia(dataISO)}${eventosDia.map(e=>`<li title="${e.titulo}" ${ehAdmin ? 'style="cursor:pointer" data-id="'+e.id+'" onclick="abrirFormEvento(this.dataset.id)"' : ''}>${e.titulo}</li>`).join('')}</ul>
    </div>`;
  }
  grade.innerHTML = html;

  const hojeISO = dataParaISOLocal(new Date());
  const proximos = eventosCache
    .filter(e=> e.fim >= hojeISO)
    .sort((a,b)=> a.inicio.localeCompare(b.inicio))
    .slice(0,8);
  const alvo = document.getElementById('lista-proximos-eventos');
  if(proximos.length===0){ alvo.innerHTML = `<div class="vazio">Nenhum evento futuro cadastrado.</div>`; return; }
  alvo.innerHTML = `<table><thead><tr><th>Período</th><th>Evento</th><th>Tipo</th>${ehAdmin?'<th></th>':''}</tr></thead><tbody>
    ${proximos.map(e=>`
      <tr>
        <td>${e.inicio===e.fim ? formatarData(e.inicio) : formatarData(e.inicio)+' a '+formatarData(e.fim)}</td>
        <td>${e.titulo}</td>
        <td>${e.tipo}</td>
        ${ehAdmin ? `<td><button class="btn btn-sm btn-secundario" onclick="abrirFormEvento('${e.id}')">Editar</button> <button class="btn btn-sm btn-perigo" onclick="excluirEvento('${e.id}')">Excluir</button></td>` : ''}
      </tr>`).join('')}
  </tbody></table>`;
}
let eventoEditandoId = null;
function abrirFormEvento(idEdicao){
  if(!podeGerenciar()) return;
  const ev = idEdicao ? eventosCache.find(function(x){ return x.id === idEdicao; }) : null;
  eventoEditandoId = ev ? ev.id : null;
  abrirModal(`
    <h3>${ev ? 'Editar evento' : 'Novo evento'}</h3>
    <div class="campo"><label>Título</label><input type="text" id="ef-titulo"></div>
    <div class="linha-form">
      <div class="campo"><label>Início</label><input type="date" id="ef-inicio" onchange="sincronizarFimEvento()"></div>
      <div class="campo"><label>Término</label><input type="date" id="ef-fim"></div>
    </div>
    <div class="campo"><label>Tipo</label>
      <select id="ef-tipo">
        <option>Treino</option><option>Competição</option><option>Reunião</option>
        <option>Feriado</option><option>Outro</option>
      </select>
    </div>
    <p style="font-size:0.8rem;color:var(--texto-suave);margin-top:-6px;">Para um evento de um dia só, preencha início e término com a mesma data.</p>
    <div class="barra-acoes">
      <button class="btn btn-primario" onclick="salvarEvento()">Salvar</button>
      <button class="btn btn-secundario" onclick="fecharModal()">Cancelar</button>
    </div>
  `);
  if(ev){
    document.getElementById('ef-titulo').value = ev.titulo;
    document.getElementById('ef-inicio').value = ev.inicio;
    document.getElementById('ef-fim').value = ev.fim;
    document.getElementById('ef-tipo').value = ev.tipo;
  }
}
function sincronizarFimEvento(){
  const fimEl = document.getElementById('ef-fim');
  if(fimEl && !fimEl.value) fimEl.value = document.getElementById('ef-inicio').value;
}
async function salvarEvento(){
  const titulo = document.getElementById('ef-titulo').value.trim();
  const inicio = document.getElementById('ef-inicio').value;
  let fim = document.getElementById('ef-fim').value || inicio;
  const tipo = document.getElementById('ef-tipo').value;
  if(!titulo || !inicio){ mostrarToast('Preencha título e data de início.'); return; }
  if(fim < inicio){ mostrarToast('A data de término não pode ser antes da data de início.'); return; }
  try{
    await api(eventoEditandoId ? 'eventos/'+eventoEditandoId : 'eventos', {method: eventoEditandoId ? 'PUT' : 'POST', corpo:{titulo, inicio, fim, tipo}});
  }catch(e){ return; }
  fecharModal();
  await carregarEventos();
  mostrarToast(eventoEditandoId ? 'Evento atualizado.' : 'Evento adicionado.');
  eventoEditandoId = null;
}
async function excluirEvento(id){
  try{ await api('eventos/'+id, {method:'DELETE'}); }catch(e){ return; }
  await carregarEventos();
}
